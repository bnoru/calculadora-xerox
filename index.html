<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora Xerox do Victor</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f3f4f6;color:#111827}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 12px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:16px}
th:last-child,td:last-child{padding-right:16px}
tbody tr:not(:last-child){border-bottom:1px solid #e5e7eb}
tbody tr:hover{background:#f9fafb}
input[type="number"]::-webkit-inner-spin-button,input[type="number"]::-webkit-outer-spin-button{opacity:0.4}
.col-qty{width:80px;min-width:80px}
.col-price{width:140px;min-width:140px}
.col-cut{width:60px;min-width:60px;text-align:center}
.col-sub{width:110px;min-width:110px}
</style>
</head>
<body>

<div id="app" class="min-h-screen">
  <!-- Header -->
  <div class="bg-gray-900 text-white px-4 py-5">
    <div class="max-w-7xl mx-auto flex items-center gap-3">
      <img src="https://raw.githubusercontent.com/bruno-xerox/calculadora/refs/heads/main/logo%20xerox%20branco.png" alt="Logo Xerox" class="h-9">
      <h1 class="text-xl font-bold">Calculadora Xerox do Victor</h1>
    </div>
  </div>

  <div class="max-w-7xl mx-auto px-4 py-4">

    <!-- Grand Total -->
    <div class="bg-white border border-gray-200 rounded-lg p-4 mb-4 flex items-center justify-between shadow-sm">
      <div>
        <span class="font-semibold text-gray-900">Total Geral</span>
        <p class="text-xs text-gray-500">Todos os serviços</p>
      </div>
      <span class="text-2xl font-bold text-gray-900" id="grandTotal">R$ 0,00</span>
    </div>

    <!-- Tabs -->
    <div class="flex gap-1 mb-4 bg-white border border-gray-200 rounded-lg p-1 shadow-sm" id="tabs"></div>

    <!-- Categories -->
    <div id="contents"></div>

    <!-- Bottom Total -->
    <div class="bg-gray-900 text-white rounded-lg p-5 mt-6 flex items-center justify-between shadow-sm">
      <div>
        <h2 class="text-lg font-bold">Total Geral</h2>
        <p class="text-xs text-gray-400">Preço calculado conforme tabela de descontos por quantidade</p>
      </div>
      <span class="text-3xl font-bold" id="grandTotal2">R$ 0,00</span>
    </div>
  </div>
</div>

<script>
// ========== DATA ==========
const categories = [
  {id:1,name:"Color",groups:[
    {name:"Papel comum",items:[
      {id:27,name:"A4",pricing_rules:{type:"tiered",tiers:[{rate:1.2,min_qty:111},{rate:2,min_qty:51},{rate:2.5,min_qty:31},{rate:3,min_qty:16},{rate:3.5,min_qty:0}]}},
      {id:28,name:"A3",pricing_rules:{type:"tiered",tiers:[{rate:3.5,min_qty:101},{rate:4.5,min_qty:51},{rate:5.5,min_qty:21},{rate:6,min_qty:11},{rate:7,min_qty:0}]}},
      {id:29,name:"A2 traço",pricing_rules:{rate:10.45,type:"flat"}},
      {id:30,name:"A2 imagem",pricing_rules:{rate:26.65,type:"flat"}},
      {id:31,name:"A1 traço",pricing_rules:{rate:11.55,type:"flat"}},
      {id:32,name:"A1 imagem",pricing_rules:{rate:39.9,type:"flat"}},
      {id:33,name:"A0 traço",pricing_rules:{rate:22.55,type:"flat"}},
      {id:34,name:"A0 imagem",pricing_rules:{rate:79.85,type:"flat"}}
    ]},
    {name:"Cartão / Couchê 180/170g",items:[
      {id:35,name:"A4",pricing_rules:{type:"tiered",tiers:[{rate:2.5,min_qty:101},{rate:3,min_qty:51},{rate:3.5,min_qty:31},{rate:5,min_qty:0}]}},
      {id:36,name:"A3",pricing_rules:{type:"tiered",tiers:[{rate:6.5,min_qty:101},{rate:7,min_qty:51},{rate:8,min_qty:21},{rate:12,min_qty:0}]}}
    ]},
    {name:"Cartão / Couchê 250g",items:[
      {id:37,name:"A4",pricing_rules:{type:"tiered",tiers:[{rate:3,min_qty:101},{rate:3.5,min_qty:51},{rate:4.5,min_qty:31},{rate:5.5,min_qty:16},{rate:6,min_qty:0}]}},
      {id:38,name:"A3",pricing_rules:{type:"tiered",tiers:[{rate:6,min_qty:101},{rate:7,min_qty:51},{rate:9,min_qty:21},{rate:13,min_qty:0}]}}
    ]},
    {name:"Adesivo",items:[
      {id:39,name:"A4",pricing_rules:{type:"tiered",tiers:[{rate:5.5,min_qty:11},{rate:6.5,min_qty:0}]}},
      {id:40,name:"A3",pricing_rules:{type:"tiered",tiers:[{rate:9,min_qty:21},{rate:10,min_qty:11},{rate:12,min_qty:0}]}}
    ]},
    {name:"Vegetal",items:[
      {id:41,name:"A4",pricing_rules:{rate:7,type:"flat"}},
      {id:42,name:"A3",pricing_rules:{type:"tiered",tiers:[{rate:8,min_qty:12},{rate:10,min_qty:0}]}}
    ]}
  ]},
  {id:2,name:"P/B",groups:[
    {name:"Papel comum",items:[
      {id:43,name:"A4",pricing_rules:{type:"tiered",tiers:[{rate:0.2,min_qty:751},{rate:0.25,min_qty:501},{rate:0.35,min_qty:251},{rate:0.4,min_qty:101},{rate:0.5,min_qty:4},{rate:1,min_qty:0}]}},
      {id:44,name:"A3",pricing_rules:{rate:2,type:"flat"}},
      {id:45,name:"A2 traço",pricing_rules:{rate:7.15,type:"flat"}},
      {id:46,name:"A2 imagem",pricing_rules:{rate:21.25,type:"flat"}},
      {id:47,name:"A1 traço",pricing_rules:{rate:10.15,type:"flat"}},
      {id:48,name:"A1 imagem",pricing_rules:{rate:32.45,type:"flat"}},
      {id:49,name:"A0 traço",pricing_rules:{rate:18.6,type:"flat"}},
      {id:50,name:"A0 imagem",pricing_rules:{rate:63.5,type:"flat"}}
    ]}
  ]},
  {id:3,name:"Adesivos",groups:[
    {name:"Leitoso corte simples",items:[
      {id:51,name:"Até 1 m²",pricing_rules:{type:"adhesive",bleed:0.002,tiers:[{rate:50,min_m2:4.01},{rate:55,min_m2:1.01},{rate:60,min_m2:0}],min_charge:30}}
    ]},
    {name:"Leitoso corte contorno",items:[
      {id:52,name:"Até 1 m²",pricing_rules:{type:"adhesive",bleed:0.002,tiers:[{rate:55,min_m2:4.01},{rate:65,min_m2:2.01},{rate:80,min_m2:1.01},{rate:120,min_m2:0}],min_charge:45}}
    ]}
  ]}
];

// ========== HELPERS ==========
const fmt = v => new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(v);
const parse = v => { if(!v)return 0; const c=v.replace(/[R$\s]/g,"").replace(/\./g,"").replace(",","."); return parseFloat(c)||0; };
const findRate = (q,t)=>{for(const r of t)if(q>=r.min_qty)return r.rate;return t[t.length-1]?.rate||0};
const findAdh = (m,t)=>{for(const r of t)if(m>=r.min_m2)return r.rate;return t[t.length-1]?.rate||0};

function recalc(){
  let total=0;
  document.querySelectorAll("[data-st]").forEach(el=>total+=parse(el.textContent));
  document.getElementById("grandTotal").textContent=fmt(total);
  document.getElementById("grandTotal2").textContent=fmt(total);
  document.querySelectorAll("[data-group]").forEach(g=>{
    let t=0;g.querySelectorAll("[data-st]").forEach(e=>t+=parse(e.textContent));
    const el=g.querySelector("[data-gt]");if(el)el.textContent=fmt(t);
  });
  document.querySelectorAll("[data-cat]").forEach(c=>{
    let t=0;c.querySelectorAll("[data-st]").forEach(e=>t+=parse(e.textContent));
    const el=c.querySelector("[data-ct]");if(el)el.textContent=fmt(t);
  });
}

function calcRow(row){
  const rules=JSON.parse(row.dataset.rules);
  const qty=parseFloat(row.querySelector("[data-qty]")?.value)||0;
  let sub=0;
  if(rules.type==="flat") sub=qty*rules.rate;
  else if(rules.type==="tiered") sub=qty*findRate(qty,rules.tiers);
  else if(rules.type==="adhesive"){
    const w=parseFloat(row.querySelector("[data-w]")?.value)||0;
    const h=parseFloat(row.querySelector("[data-h]")?.value)||0;
    const b=rules.bleed||0;
    if(w>0&&h>0){
      const m2=(w+b)*(h+b)*qty;
      sub=Math.max(m2*findAdh(m2,rules.tiers),rules.min_charge||0);
      const e=row.querySelector("[data-m2]");if(e)e.textContent=m2.toFixed(3);
    }
  }
  const cut=row.querySelector("[data-cut]");
  if(cut&&cut.checked&&qty>0) sub+=qty*1;
  const st=row.querySelector("[data-st]");if(st)st.textContent=fmt(sub);
  recalc();
}

// ========== RENDER ==========
const tabsEl=document.getElementById("tabs");
categories.forEach((c,i)=>{
  const b=document.createElement("button");
  b.className=`flex-1 py-2 px-3 text-sm font-medium rounded-md transition cursor-pointer ${i===0?"bg-gray-900 text-white":"text-gray-700 hover:bg-gray-100"}`;
  b.textContent=c.name;
  b.onclick=function(){
    tabsEl.querySelectorAll("button").forEach(t=>{t.className="flex-1 py-2 px-3 text-sm font-medium rounded-md transition cursor-pointer text-gray-700 hover:bg-gray-100"});
    this.className="flex-1 py-2 px-3 text-sm font-medium rounded-md transition cursor-pointer bg-gray-900 text-white";
    document.querySelectorAll("[data-cat]").forEach(el=>el.classList.add("hidden"));
    const t=document.getElementById("cat_"+this.dataset.id);
    if(t)t.classList.remove("hidden");
  };
  b.dataset.id=c.id;
  tabsEl.appendChild(b);
});

const contentsEl=document.getElementById("contents");
categories.forEach((c,ci)=>{
  const div=document.createElement("div");div.id="cat_"+c.id;div.dataset.cat=c.id;
  div.className=(ci===0?"":"hidden ")+"space-y-4";
  c.groups.forEach(g=>{
    const isPaper=g.name.includes("Papel comum");
    const isAdesivos=c.name==="Adesivos";
    const showCut=!isPaper&&!isAdesivos;
    const isAdh=g.items.some(i=>i.pricing_rules?.type==="adhesive");
    const grp=document.createElement("div");grp.className="bg-white border border-gray-200 rounded-lg overflow-hidden shadow-sm";grp.dataset.group=g.name;
    let html=`<div class="px-4 py-3 bg-gray-50 border-b border-gray-200 flex items-center gap-2"><div class="w-1 h-6 bg-gray-500 rounded-full"></div><h3 class="font-semibold text-sm">${g.name}</h3><span class="ml-auto text-xs text-gray-500">Subtotal: <span class="font-bold text-gray-900" data-gt>R$ 0,00</span></span></div>`;
    html+=`<table><thead><tr class="text-xs uppercase text-gray-500 bg-gray-50/50">`;
    html+=`<th>Item</th><th class="col-price">Preço Unit.</th><th class="col-qty">Qtde.</th>`;
    if(showCut) html+=`<th class="col-cut">Corte?</th>`;
    if(isAdh) html+=`<th>Largura</th><th>Altura</th><th>m²</th>`;
    html+=`<th class="col-sub">Subtotal</th></tr></thead><tbody>`;
    g.items.forEach(item=>{
      const r=item.pricing_rules;
      let pd="";
      if(r.type==="flat") pd=`R$ ${r.rate.toFixed(2)}`;
      else if(r.type==="tiered") pd=r.tiers.map(t=>"R$ "+t.rate.toFixed(2)).join(" | ");
      else if(r.type==="adhesive") pd=r.tiers.map(t=>"R$ "+t.rate.toFixed(2)+"/m²").join(" | ");
      const isAdhesive=r?.type==="adhesive";
      html+=`<tr data-rules='${JSON.stringify(r).replace(/'/g,"&#39;")}'>`;
      html+=`<td class="font-medium text-sm">${item.name}</td>`;
      html+=`<td class="col-price"><span class="text-xs text-gray-600">${pd}</span></td>`;
      html+=`<td class="col-qty"><input type="number" min="0" step="1" value="" data-qty class="input input-bordered input-xs w-full bg-white text-right" oninput="calcRow(this.closest('[data-rules]'))"></td>`;
      if(showCut) html+=`<td class="col-cut"><input type="checkbox" data-cut class="toggle toggle-xs" style="--tglbg:#111827;background:#d1d5db" onchange="calcRow(this.closest('[data-rules]'))"></td>`;
      if(isAdhesive) html+=`<td><input type="number" min="0" step="0.01" value="" data-w class="input input-bordered input-xs w-full bg-white text-right" placeholder="0,00" oninput="calcRow(this.closest('[data-rules]'))"></td><td><input type="number" min="0" step="0.01" value="" data-h class="input input-bordered input-xs w-full bg-white text-right" placeholder="0,00" oninput="calcRow(this.closest('[data-rules]'))"></td><td class="text-xs text-gray-500" data-m2>0,000</td>`;
      html+=`<td class="col-sub font-semibold text-sm" data-st>R$ 0,00</td></tr>`;
    });
    html+=`</tbody></table>`;
    grp.innerHTML=html;
    div.appendChild(grp);
  });
  const ct=document.createElement("div");ct.className="bg-white border border-gray-200 rounded-lg p-4 flex justify-end items-center gap-4 shadow-sm";
  ct.innerHTML=`<span class="text-sm text-gray-700">Total ${c.name}</span><span class="text-lg font-bold text-gray-900" data-ct>R$ 0,00</span>`;
  div.appendChild(ct);
  contentsEl.appendChild(div);
});
</script>
</body>
</html>
