  <!-- ─── HTML ─── -->

    <div class="bg-gray-900 text-white">

        <div class="flex items-center gap-5">
          <div class="w-12 h-12 sm:w-14 sm:h-14 bg-white/10 rounded-xl flex items-center justify-center">
            <i class="fas fa-print text-2xl sm:text-3xl text-white"></i>
          </div>
          <div>
            <h1 class="text-3xl sm:text-4xl font-bold tracking-tight">Calculadora Xerox do Victor</h1>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 -mt-6 pb-36">

      <!-- Custom Services Section -->
      <div class="bg-white rounded-2xl shadow-sm border border-base-200 overflow-hidden">

  <!-- ─── STYLES ─── -->
  <style>
    #app { animation: fadeIn 0.4s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .input:focus { transform: scale(1.02); }
    .tab { transition: all 0.2s ease; }
    .tab-active:not(.btn) { transform: scale(1.02); }
    .tabs-boxed .tab-active {
      --tab-bg: #111827 !important;
      --tab-border: #111827 !important;
      background-color: #111827 !important;
      color: white !important;
    }
    .tabs-boxed .tab-active:hover {
      background-color: #1f2937 !important;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { opacity: 0.4; }
    .input-error { outline: 2px solid #ef4444; outline-offset: -2px; }
    @keyframes slideOut {
      from { opacity: 1; transform: translateX(0); }
      to   { opacity: 0; transform: translateX(20px); }
    }
  </style>

  <!-- ─── JAVASCRIPT ─── -->
  <script>
    (function() {
      'use strict';

      // ── Utility ──

      function formatCurrency(value) {
        return new Intl.NumberFormat("pt-BR", {
          style: "currency",
          currency: "BRL"
        }).format(value);
      }

      function parseCurrency(value) {
        if (!value) return 0;
        var cleaned = value
          .replace(/[R$\s]/g, "")
          .replace(/\./g, "")
          .replace(",", ".");
        return parseFloat(cleaned) || 0;
      }

      function escapeHtml(str) {
        var div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      function findTieredRate(qty, tiers) {
        for (var i = 0; i < tiers.length; i++) {
          if (qty >= tiers[i].min_qty) return tiers[i].rate;
        }
        return tiers.length > 0 ? tiers[tiers.length - 1].rate : 0;
      }

      function findAdhesiveRate(m2, tiers) {
        for (var i = 0; i < tiers.length; i++) {
          if (m2 >= tiers[i].min_m2) return tiers[i].rate;
        }
        return tiers.length > 0 ? tiers[tiers.length - 1].rate : 0;
      }

      function formatRateDisplay(rules) {
        if (rules.type === "flat") {
          return "R$ " + rules.rate.toFixed(2);
        } else if (rules.type === "tiered") {
          return rules.tiers.map(function(t) { return "R$ " + t.rate.toFixed(2); }).join(" | ");
        } else if (rules.type === "adhesive") {
          return rules.tiers.map(function(t) { return "R$ " + t.rate.toFixed(2) + "/m²"; }).join(" | ");
        }
        return "";
      }

      function getIconForGroup(groupName) {
        if (groupName.indexOf("Papel comum") !== -1) return "fa-file";
        if (groupName.indexOf("Cartão") !== -1 || groupName.indexOf("Couchê") !== -1) return "fa-id-card";
        if (groupName.indexOf("Adesivo") !== -1 || groupName.indexOf("Leitoso") !== -1) return "fa-tag";
        if (groupName.indexOf("Vegetal") !== -1) return "fa-leaf";
        return "fa-file";
      }

      // ── Render Categories ──

      function render() {
        renderTabs();
        renderCategories();
      }

      function renderTabs() {
        var container = document.getElementById("tabs-container");
        container.innerHTML = "";
        CATEGORIES.forEach(function(cat, index) {
          var btn = document.createElement("button");
          btn.className = "tab tab-lg gap-2 flex-1 transition-all duration-200" +
            (index === 0 ? " tab-active bg-gray-900 text-white hover:bg-gray-800" : " hover:bg-gray-100");
          btn.setAttribute("data-category-id", cat.id);
          btn.setAttribute("data-action", "switch-tab");
          btn.innerHTML = '<i class="fas ' + cat.icon + '"></i><span class="hidden sm:inline">' + cat.name + '</span>';
          container.appendChild(btn);
        });
      }

      function renderCategories() {
        var container = document.getElementById("categories-container");
        container.innerHTML = "";

        CATEGORIES.forEach(function(cat, catIndex) {
          var catDiv = document.createElement("div");
          catDiv.id = "category_" + cat.id;
          catDiv.className = (catIndex === 0 ? "" : "hidden") + " space-y-6";

          cat.groups.forEach(function(group) {
            var isAdhesive = group.items.some(function(it) { return it.pricingRules.type === "adhesive"; });
            var groupHtml = '';

            groupHtml += '<div class="bg-white rounded-2xl shadow-sm border border-base-200 overflow-hidden transition-all duration-200 hover:shadow-md">';
            groupHtml += '  <div class="px-6 py-4 bg-gradient-to-r from-base-100 to-base-50 border-b border-base-200 flex items-center gap-3">';
            groupHtml += '    <i class="fas ' + getIconForGroup(group.name) + ' text-gray-500"></i>';
            groupHtml += '    <h3 class="text-lg font-semibold text-base-content">' + group.name + '</h3>';
            groupHtml += '    <span class="ml-auto text-sm font-medium text-base-content/60">Subtotal: <span class="font-mono font-bold text-gray-900 group-total">R$ 0,00</span></span>';
            groupHtml += '  </div>';
            groupHtml += '  <div class="overflow-x-auto">';
            groupHtml += '    <table class="table table-zebra table-pin-rows">';
            groupHtml += '      <thead>';
            groupHtml += '        <tr class="text-sm uppercase tracking-wider text-base-content/50">';
            groupHtml += '          <th class="py-4 pl-6">Item</th>';
            groupHtml += '          <th class="py-4 text-right">Preço Unit.</th>';
            groupHtml += '          <th class="py-4 text-right">Qtde.</th>';
            if (group.name.indexOf("Papel comum") === -1) {
              groupHtml += '          <th class="py-4 text-center">Corte?</th>';
            }
            if (isAdhesive) {
              groupHtml += '          <th class="py-4 text-right">Largura (m)</th>';
              groupHtml += '          <th class="py-4 text-right">Altura (m)</th>';
              groupHtml += '          <th class="py-4 text-right">m²</th>';
            }
            groupHtml += '          <th class="py-4 pr-6 text-right">Subtotal</th>';
            groupHtml += '        </tr>';
            groupHtml += '      </thead>';
            groupHtml += '      <tbody>';

            group.items.forEach(function(item) {
              var isItemAdhesive = item.pricingRules.type === "adhesive";
              var cutExtra = "";

              if (group.name.indexOf("Papel comum") === -1) {
                cutExtra = '<td class="text-center py-4">' +
                  '<input type="checkbox" class="toggle toggle-xs border-gray-300 bg-gray-200 [&:checked]:bg-gray-900 [&:checked]:border-gray-900 cut-checkbox" />' +
                  '</td>';
              }

              var adhesiveExtra = "";
              if (isItemAdhesive) {
                adhesiveExtra = '<td class="text-right py-4">' +
                  '<input type="number" min="0" step="0.01" value="" class="input input-bordered input-sm w-24 text-right font-mono transition-all duration-150 adhesive-width" placeholder="0,00" />' +
                  '</td>' +
                  '<td class="text-right py-4">' +
                  '<input type="number" min="0" step="0.01" value="" class="input input-bordered input-sm w-24 text-right font-mono transition-all duration-150 adhesive-height" placeholder="0,00" />' +
                  '</td>' +
                  '<td class="text-right py-4"><span class="font-mono text-sm text-base-content/60 adhesive-m2">0,000</span></td>';
              }

              groupHtml += '<tr class="transition-all duration-150 hover:bg-base-200/50 data-row" data-pricing-rules=\'' + JSON.stringify(item.pricingRules) + '\'>';
              groupHtml += '  <td class="pl-6 py-4">';
              groupHtml += '    <div class="flex items-center gap-3">';
              groupHtml += '      <span class="font-medium text-base-content">' + item.name + '</span>';
              groupHtml += '    </div>';
              groupHtml += '  </td>';
              groupHtml += '  <td class="text-right py-4">';
              groupHtml += '    <div class="flex flex-col items-end">';
              groupHtml += '      <span class="font-mono text-sm rate-display">' + formatRateDisplay(item.pricingRules) + '</span>';
              groupHtml += '    </div>';
              groupHtml += '  </td>';
              groupHtml += '  <td class="text-right py-4">';
              groupHtml += '    <input type="number" min="0" step="1" value="" class="input input-bordered input-sm w-20 text-right font-mono transition-all duration-150 qty-input" />';
              groupHtml += '  </td>';
              groupHtml += cutExtra;
              groupHtml += adhesiveExtra;
              groupHtml += '  <td class="pr-6 py-4 text-right">';
              groupHtml += '    <span class="font-mono font-semibold text-gray-900 text-lg item-subtotal">R$ 0,00</span>';
              groupHtml += '  </td>';
              groupHtml += '</tr>';
            });

            groupHtml += '      </tbody>';
            groupHtml += '    </table>';
            groupHtml += '  </div>';
            groupHtml += '</div>';

            catDiv.innerHTML += groupHtml;
          });

          // Category total
          catDiv.innerHTML += '<div class="bg-white rounded-2xl shadow-sm border border-base-200 p-6 flex justify-end items-center gap-6">' +
            '<span class="text-xl font-medium text-base-content/70">Total ' + cat.name + '</span>' +
            '<span class="text-2xl font-bold text-gray-900 category-total">R$ 0,00</span>' +
            '</div>';

          container.appendChild(catDiv);
        });
      }

      // ── Calculation Logic ──

      function calculateRow(row) {
        var rules = JSON.parse(row.getAttribute("data-pricing-rules"));
        var qty = parseFloat(row.querySelector(".qty-input")?.value) || 0;
        var subtotal = 0;

        if (rules.type === "flat") {
          subtotal = qty * rules.rate;
        } else if (rules.type === "tiered") {
          var rate = findTieredRate(qty, rules.tiers);
          subtotal = qty * rate;
        } else if (rules.type === "adhesive") {
          var width = parseFloat(row.querySelector(".adhesive-width")?.value) || 0;
          var height = parseFloat(row.querySelector(".adhesive-height")?.value) || 0;
          var bleed = rules.bleed || 0;
          if (width > 0 && height > 0) {
            var effW = width + bleed;
            var effH = height + bleed;
            var m2 = effW * effH * qty;
            var rate = findAdhesiveRate(m2, rules.tiers);
            var rawTotal = m2 * rate;
            subtotal = Math.max(rawTotal, rules.min_charge || 0);
            var m2El = row.querySelector(".adhesive-m2");
            if (m2El) m2El.textContent = m2.toFixed(3);
          }
        }

        // Cut fee: R$ 1,00 per unit
        var cutCb = row.querySelector(".cut-checkbox");
        if (cutCb && cutCb.checked && qty > 0) {
          subtotal += qty * 1.00;
        }

        var subEl = row.querySelector(".item-subtotal");
        if (subEl) subEl.textContent = formatCurrency(subtotal);

        calculateAll();
      }

      function calculateAll() {
        var total = 0;

        // All item subtotals
        document.querySelectorAll(".item-subtotal").forEach(function(el) {
          total += parseCurrency(el.textContent);
        });

        // Custom services
        document.querySelectorAll("#custom-services-list .custom-service-price").forEach(function(el) {
          total += parseCurrency(el.textContent);
        });

        // Update grand totals
        document.getElementById("grand-total").textContent = formatCurrency(total);
        document.getElementById("grand-total-sticky").textContent = formatCurrency(total);

        // Group subtotals
        document.querySelectorAll(".bg-white.rounded-2xl.shadow-sm.border").forEach(function(group) {
          var groupTotal = 0;
          group.querySelectorAll(".item-subtotal").forEach(function(el) {
            groupTotal += parseCurrency(el.textContent);
          });
          var gtEl = group.querySelector(".group-total");
          if (gtEl) gtEl.textContent = formatCurrency(groupTotal);
        });

        // Category totals
        document.querySelectorAll("[id^='category_']").forEach(function(cat) {
          var catTotal = 0;
          cat.querySelectorAll(".item-subtotal").forEach(function(el) {
            catTotal += parseCurrency(el.textContent);
          });
          var ctEl = cat.querySelector(".category-total");
          if (ctEl) ctEl.textContent = formatCurrency(catTotal);
        });

        // Custom services total
        var customTotal = 0;
        document.querySelectorAll("#custom-services-list .custom-service-price").forEach(function(el) {
          customTotal += parseCurrency(el.textContent);
        });
        var cstEl = document.getElementById("custom-services-total");
        if (cstEl) cstEl.textContent = formatCurrency(customTotal);
      }

      // ── Tab Switching ──

      function switchTab(categoryId) {
        document.querySelectorAll("[data-category-id]").forEach(function(t) {
          t.classList.remove("tab-active", "bg-gray-900", "text-white", "hover:bg-gray-800");
          t.classList.add("hover:bg-gray-100");
        });
        var activeTab = document.querySelector("[data-category-id='" + categoryId + "']");
        if (activeTab) {
          activeTab.classList.add("tab-active", "bg-gray-900", "text-white", "hover:bg-gray-800");
          activeTab.classList.remove("hover:bg-gray-100");
        }

        document.querySelectorAll("[id^='category_']").forEach(function(el) {
          el.classList.add("hidden");
        });
        var target = document.getElementById("category_" + categoryId);
        if (target) target.classList.remove("hidden");
      }

      // ── Custom Services ──

      function addCustomService() {
        var nameInput = document.getElementById("custom-service-name");
        var priceInput = document.getElementById("custom-service-price");
        var name = nameInput?.value?.trim();
        var price = parseFloat(priceInput?.value) || 0;

        if (!name) {
          nameInput?.focus();
          nameInput?.classList.add("input-error");
          setTimeout(function() { nameInput?.classList.remove("input-error"); }, 1000);
          return;
        }
        if (price <= 0) {
          priceInput?.focus();
          priceInput?.classList.add("input-error");
          setTimeout(function() { priceInput?.classList.remove("input-error"); }, 1000);
          return;
        }

        var list = document.getElementById("custom-services-list");
        if (!list) return;

        var rowId = "custom-service-" + Date.now();
        var row = document.createElement("div");
        row.id = rowId;
        row.className = "flex items-center justify-between p-3 bg-white rounded-xl border border-base-200 transition-all duration-200 hover:shadow-sm";
        row.style.animation = "fadeIn 0.2s ease-out";
        row.innerHTML = '<div class="flex items-center gap-3 min-w-0 flex-1">' +
          '<i class="fas fa-cog text-gray-400"></i>' +
          '<span class="font-medium text-base-content truncate">' + escapeHtml(name) + '</span>' +
          '</div>' +
          '<div class="flex items-center gap-4">' +
          '<span class="font-mono font-semibold text-lg text-gray-900 custom-service-price">' + formatCurrency(price) + '</span>' +
          '<button class="btn btn-ghost btn-xs btn-square text-gray-400 hover:text-red-500 transition-colors remove-service" data-service-row="' + rowId + '">' +
          '<i class="fas fa-times"></i>' +
          '</button>' +
          '</div>';

        list.appendChild(row);
        nameInput.value = "";
        priceInput.value = "";
        calculateAll();
        nameInput.focus();
      }

      // ── Print Receipt ──

      function printReceipt() {
        var receiptData = collectReceiptData();
        var printWin = window.open("", "_blank", "width=800,height=600");

        printWin.document.write('<!DOCTYPE html><html><head>' +
          '<meta charset="utf-8">' +
          '<title>Recibo - Calculadora Xerox do Victor</title>' +
          '<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />' +
          '<style>' +
          '@page { margin: 15mm; }' +
          '* { box-sizing: border-box; }' +
          'body { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1f2937; background: #fff; padding: 0; margin: 0; }' +
          '.receipt { max-width: 700px; margin: 0 auto; padding: 32px 24px; }' +
          '.header { text-align: center; border-bottom: 2px solid #1f2937; padding-bottom: 20px; margin-bottom: 24px; }' +
          '.header h1 { font-size: 24px; font-weight: 800; margin: 0 0 4px 0; text-transform: uppercase; letter-spacing: 0.05em; }' +
          '.header p { color: #6b7280; font-size: 14px; margin: 0; }' +
          '.section-title { font-size: 14px; font-weight: 700; text-transform: uppercase; color: #6b7280; letter-spacing: 0.05em; margin: 20px 0 8px 0; padding-bottom: 4px; border-bottom: 1px solid #e5e7eb; }' +
          'table { width: 100%; border-collapse: collapse; font-size: 13px; }' +
          'th { text-align: left; padding: 6px 4px; font-weight: 600; color: #6b7280; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid #e5e7eb; }' +
          'th:last-child, td:last-child { text-align: right; }' +
          'td { padding: 5px 4px; border-bottom: 1px solid #f3f4f6; }' +
          '.text-right { text-align: right; }' +
          '.font-mono { font-family: "Courier New", monospace; }' +
          '.total-row td { font-weight: 700; border-top: 2px solid #1f2937; border-bottom: none; padding-top: 10px; font-size: 15px; }' +
          '.grand-total td { font-size: 18px; border-top: 3px double #1f2937; padding-top: 10px; }' +
          '.empty-msg { color: #9ca3af; font-style: italic; padding: 8px 4px; }' +
          '.footer { text-align: center; margin-top: 32px; padding-top: 16px; border-top: 1px solid #e5e7eb; font-size: 12px; color: #9ca3af; }' +
          '@media print { body { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }' +
          '</style></head><body><div class="receipt">' +
          '<div class="header"><h1>Calculadora Xerox do Victor</h1><p>Recibo de Orçamento</p></div>');

        receiptData.categories.forEach(function(cat) {
          if (cat.items.length === 0) return;
          printWin.document.write('<div class="section-title">' + cat.name + '</div><table><thead><tr><th>Item</th><th>Qtd</th><th>Preço</th><th>Subtotal</th></tr></thead><tbody>');
          cat.items.forEach(function(item) {
            printWin.document.write('<tr><td>' + item.name + '</td><td>' + item.qty + '</td><td class="font-mono">' + item.unitPrice + '</td><td class="font-mono">' + item.subtotal + '</td></tr>');
          });
          printWin.document.write('</tbody></table>');
        });

        if (receiptData.customServices.length > 0) {
          printWin.document.write('<div class="section-title">Outros Serviços</div><table><thead><tr><th>Serviço</th><th colspan="2"></th><th>Valor</th></tr></thead><tbody>');
          receiptData.customServices.forEach(function(svc) {
            printWin.document.write('<tr><td>' + svc.name + '</td><td colspan="2"></td><td class="font-mono">' + svc.price + '</td></tr>');
          });
          printWin.document.write('</tbody></table>');
        }

        printWin.document.write('<table><tfoot><tr class="total-row grand-total"><td colspan="3">TOTAL GERAL</td><td class="font-mono">' + formatCurrency(receiptData.total) + '</td></tr></tfoot></table>' +
          '<div class="footer"><p>Gerado em ' + new Date().toLocaleDateString("pt-BR", { day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" }) + '</p>' +
          '<p>Calculadora Xerox do Victor &mdash; Obrigado pela preferência!</p></div></div>' +
          '<script>window.onload = function() { window.print(); }</' + 'script>' +
          '</body></html>');

        printWin.document.close();
      }

      function collectReceiptData() {
        var categories = [];
        CATEGORIES.forEach(function(cat) {
          var catEl = document.getElementById("category_" + cat.id);
          if (!catEl) return;
          var items = [];
          catEl.querySelectorAll(".data-row").forEach(function(row) {
            var qty = parseFloat(row.querySelector(".qty-input")?.value) || 0;
            if (qty <= 0) return;
            var nameEl = row.querySelector(".font-medium");
            var name = nameEl?.textContent?.trim() || "Item";
            var subtotal = row.querySelector(".item-subtotal")?.textContent || "R$ 0,00";
            var rateDisplay = row.querySelector(".rate-display")?.textContent || "";
            items.push({ name: name, qty: qty, unitPrice: rateDisplay, subtotal: subtotal });
          });
          if (items.length > 0) categories.push({ name: cat.name, items: items });
        });

        var customServices = [];
        document.querySelectorAll("#custom-services-list > div").forEach(function(row) {
          var nameEl = row.querySelector(".font-medium");
          var priceEl = row.querySelector(".custom-service-price");
          if (nameEl && priceEl) customServices.push({ name: nameEl.textContent.trim(), price: priceEl.textContent.trim() });
        });

        var total = parseCurrency(document.getElementById("grand-total").textContent);
        return { categories: categories, customServices: customServices, total: total };
      }

      // ── Event Binding ──

      function init() {
        render();

        // Tab switching (event delegation)
        document.getElementById("tabs-container").addEventListener("click", function(e) {
          var btn = e.target.closest("[data-category-id]");
          if (btn) {
            e.preventDefault();
            switchTab(btn.getAttribute("data-category-id"));
          }
        });

        // Calculation triggers (event delegation)
        document.getElementById("categories-container").addEventListener("input", function(e) {
          var row = e.target.closest(".data-row");
          if (row) calculateRow(row);
        });

        document.getElementById("categories-container").addEventListener("change", function(e) {
          if (e.target.classList.contains("cut-checkbox")) {
            var row = e.target.closest(".data-row");
            if (row) calculateRow(row);
          }
        });

        // Custom services
        document.getElementById("add-custom-service").addEventListener("click", addCustomService);

        document.getElementById("custom-services-list").addEventListener("click", function(e) {
          var btn = e.target.closest(".remove-service");
          if (btn) {
            var rowId = btn.getAttribute("data-service-row");
            var row = document.getElementById(rowId);
            if (row) {
              row.style.animation = "slideOut 0.2s ease-out forwards";
              setTimeout(function() { row.remove(); calculateAll(); }, 200);
            }
          }
        });

        // Enter key on custom service inputs
        ["custom-service-name", "custom-service-price"].forEach(function(id) {
          document.getElementById(id).addEventListener("keydown", function(e) {
            if (e.key === "Enter") {
              e.preventDefault();
              addCustomService();
            }
          });
        });

        // Print receipt
        document.getElementById("print-receipt").addEventListener("click", printReceipt);

        // Initial calculation
        calculateAll();
      }

      // Run on DOM ready
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
      } else {
        init();
      }

    })();
  </script>
</body>
