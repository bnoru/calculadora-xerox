
<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Calculadora Xerox do Victor</title>
  <!-- Tailwind CSS v3 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- DaisyUI v4 -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .fade-in { animation: fadeIn 0.4s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .input:focus { transform: scale(1.02); }
    .tab-active { transform: scale(1.02); }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { opacity: 0.4; }
    .input-error { border-color: #ef4444 !important; }
    .slide-up { animation: slideUp 0.2s ease-out; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<div id="app">
  <!-- Hero Header -->
  <div class="bg-gray-900 text-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12">
      <div class="flex items-center gap-5">
        <div class="w-12 h-12 sm:w-14 sm:h-14 flex items-center justify-center">
          <i class=""><img src="https://raw.githubusercontent.com/bnoru/calculadora-xerox/refs/heads/main/logo%20xerox%20branco.png"></i>
        </div>
        <div>
          <h1 class="text-3xl sm:text-4xl font-bold tracking-tight">Calculadora Xerox do Victor</h1>
        </div>
      </div>
    </div>
  </div>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 -mt-6 pb-36 fade-in">
    <!-- Grand Total Card (top summary) -->
    <div class="bg-white rounded-2xl shadow-xl border border-base-200 p-6 mb-8 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-gray-100 rounded-xl">
          <i class="fas fa-coins text-2xl text-gray-600"></i>
        </div>
        <div>
          <span class="text-lg font-medium text-gray-500">Total Geral</span>
          <p class="text-sm text-gray-400">Todos os serviços</p>
        </div>
      </div>
      <div class="text-3xl sm:text-4xl font-bold text-gray-900 grand-total">R$ 0,00</div>
    </div>

    <!-- Category Tabs -->
    <div class="mb-6" role="tablist">
      <div class="tabs tabs-boxed bg-white shadow-sm border border-base-200 p-1 gap-1" id="category-tabs" styles="--tab-bg: #111827 !important;
  --tab-border: #111827 !important;
  background-color: var(--tab-bg) !important;
  color: white !important;"></div>
    </div>

    <!-- Category Contents -->
    <div id="category-contents"></div>

    <!-- Custom Services Section -->
    <div class="bg-white rounded-2xl shadow-sm border border-base-200 overflow-hidden mt-6">
      <div class="px-6 py-4 bg-gradient-to-r from-gray-50 to-white border-b border-base-200 flex items-center gap-3">
        <i class="fas fa-plus-circle text-lg text-gray-500"></i>
        <h3 class="text-lg font-semibold text-gray-800">Outros Serviços</h3>
        <span class="text-sm text-gray-400">Adicione serviços que não estão na tabela acima</span>
      </div>

      <div class="p-6">
        <div id="custom-services-list" class="space-y-3 mb-4"></div>

        <div class="flex items-end gap-3 p-4 bg-gray-50 rounded-xl border border-dashed border-gray-300">
          <div class="flex-1">
            <label class="text-sm font-medium text-gray-500 block mb-1">Nome do serviço</label>
            <input type="text" id="custom-service-name"
                   placeholder="Ex: Laminação, Encadernação..."
                   class="input input-bordered input-sm w-full" />
          </div>
          <div class="w-36">
            <label class="text-sm font-medium text-gray-500 block mb-1">Valor (R$)</label>
            <input type="number" id="custom-service-price" min="0" step="0.50" placeholder="0,00"
                   class="input input-bordered input-sm w-full text-right font-mono" />
          </div>
          <button class="btn btn-primary btn-sm gap-2" onclick="Calc.addCustomService()">
            <i class="fas fa-plus"></i> Adicionar
          </button>
        </div>

        <div class="mt-4 pt-4 border-t border-gray-200 flex justify-end items-center gap-4">
          <span class="text-sm font-medium text-gray-500">Subtotal outros serviços</span>
          <span class="text-xl font-bold text-gray-900" id="custom-services-total">R$ 0,00</span>
        </div>
      </div>
    </div>

    <!-- Print Receipt Button -->
    <div class="mt-6 flex justify-center">
      <button class="btn btn-outline btn-lg gap-3 px-8" onclick="Calc.printReceipt()">
        <i class="fas fa-print text-lg"></i> Imprimir Recibo
      </button>
    </div>
  </div>

  <!-- Sticky Bottom Grand Total Bar -->
  <div class="sticky bottom-0 z-30 bg-gray-900/95 backdrop-blur-md border-t border-gray-800 shadow-[0_-8px_30px_rgba(0,0,0,0.2)]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-4">
          <i class="fas fa-receipt text-2xl text-gray-400"></i>
          <div>
            <h2 class="text-xl font-bold text-white">Total Geral</h2>
            <p class="text-gray-400 text-xs">Todos os serviços + taxas</p>
          </div>
        </div>
        <span class="text-3xl sm:text-4xl font-bold text-white grand-total">R$ 0,00</span>
      </div>
    </div>
  </div>
</div>

<script>
// ── DATA ──
const DATA = {
  categories: [
    { id: 1, name: "Color", icon: "fa-palette",
      items: [
        { group: "Papel comum", name: "A4", rules: {"type":"tiered","tiers":[{"rate":1.2,"min_qty":111},{"rate":2,"min_qty":51},{"rate":2.5,"min_qty":31},{"rate":3,"min_qty":16},{"rate":3.5,"min_qty":0}]} },
        { group: "Papel comum", name: "A3", rules: {"type":"tiered","tiers":[{"rate":3.5,"min_qty":101},{"rate":4.5,"min_qty":51},{"rate":5.5,"min_qty":21},{"rate":6,"min_qty":11},{"rate":7,"min_qty":0}]} },
        { group: "Papel comum", name: "A2 traço", rules: {"rate":10.45,"type":"flat"} },
        { group: "Papel comum", name: "A2 imagem", rules: {"rate":26.65,"type":"flat"} },
        { group: "Papel comum", name: "A1 traço", rules: {"rate":11.55,"type":"flat"} },
        { group: "Papel comum", name: "A1 imagem", rules: {"rate":39.9,"type":"flat"} },
        { group: "Papel comum", name: "A0 traço", rules: {"rate":22.55,"type":"flat"} },
        { group: "Papel comum", name: "A0 imagem", rules: {"rate":79.85,"type":"flat"} },
        { group: "Cartão / Couchê 180/170g", name: "A4", rules: {"type":"tiered","tiers":[{"rate":2.5,"min_qty":101},{"rate":3,"min_qty":51},{"rate":3.5,"min_qty":31},{"rate":5,"min_qty":0}]} },
        { group: "Cartão / Couchê 180/170g", name: "A3", rules: {"type":"tiered","tiers":[{"rate":6.5,"min_qty":101},{"rate":7,"min_qty":51},{"rate":8,"min_qty":21},{"rate":12,"min_qty":0}]} },
        { group: "Cartão / Couchê 250g", name: "A4", rules: {"type":"tiered","tiers":[{"rate":3,"min_qty":101},{"rate":3.5,"min_qty":51},{"rate":4.5,"min_qty":31},{"rate":5.5,"min_qty":16},{"rate":6,"min_qty":0}]} },
        { group: "Cartão / Couchê 250g", name: "A3", rules: {"type":"tiered","tiers":[{"rate":6,"min_qty":101},{"rate":7,"min_qty":51},{"rate":9,"min_qty":21},{"rate":13,"min_qty":0}]} },
        { group: "Adesivo", name: "A4", rules: {"type":"tiered","tiers":[{"rate":5.5,"min_qty":11},{"rate":6.5,"min_qty":0}]} },
        { group: "Adesivo", name: "A3", rules: {"type":"tiered","tiers":[{"rate":9,"min_qty":21},{"rate":10,"min_qty":11},{"rate":12,"min_qty":0}]} },
        { group: "Vegetal", name: "A4", rules: {"rate":7,"type":"flat"} },
        { group: "Vegetal", name: "A3", rules: {"type":"tiered","tiers":[{"rate":8,"min_qty":12},{"rate":10,"min_qty":0}]} }
      ]
    },
    { id: 2, name: "P/B", icon: "fa-file-lines",
      items: [
        { group: "Papel comum", name: "A4", rules: {"type":"tiered","tiers":[{"rate":0.2,"min_qty":751},{"rate":0.25,"min_qty":501},{"rate":0.35,"min_qty":251},{"rate":0.4,"min_qty":101},{"rate":0.5,"min_qty":4},{"rate":1,"min_qty":0}]} },
        { group: "Papel comum", name: "A3", rules: {"rate":2,"type":"flat"} },
        { group: "Papel comum", name: "A2 traço", rules: {"rate":7.15,"type":"flat"} },
        { group: "Papel comum", name: "A2 imagem", rules: {"rate":21.25,"type":"flat"} },
        { group: "Papel comum", name: "A1 traço", rules: {"rate":10.15,"type":"flat"} },
        { group: "Papel comum", name: "A1 imagem", rules: {"rate":32.45,"type":"flat"} },
        { group: "Papel comum", name: "A0 traço", rules: {"rate":18.6,"type":"flat"} },
        { group: "Papel comum", name: "A0 imagem", rules: {"rate":63.5,"type":"flat"} }
      ]
    },
    { id: 3, name: "Adesivos", icon: "fa-tag",
      items: [
        { group: "Leitoso corte simples", name: "Até 1 m²", rules: {"type":"adhesive","bleed":0.002,"tiers":[{"rate":50,"min_m2":4.01},{"rate":55,"min_m2":1.01},{"rate":60,"min_m2":0}],"min_charge":30} },
        { group: "Leitoso corte contorno", name: "Até 1 m²", rules: {"type":"adhesive","bleed":0.002,"tiers":[{"rate":55,"min_m2":4.01},{"rate":65,"min_m2":2.01},{"rate":80,"min_m2":1.01},{"rate":120,"min_m2":0}],"min_charge":45} }
      ]
    }
  ]
};

// ── CALCULATOR ──
const Calc = {
  init() {
    this.renderTabs()
    this.renderCategories()
    this.recalc()
  },

  // ── RENDER ──

  renderTabs() {
    const el = document.getElementById("category-tabs")
    el.innerHTML = DATA.categories.map((cat, i) =>
      `<button class="tab tab-lg gap-2 flex-1 ${i === 0 ? 'tab-active bg-gray-900 text-white' : 'hover:bg-gray-100'}"
               onclick="Calc.switchTab(${cat.id})">
        <i class="fas ${cat.icon}"></i>
        <span class="hidden sm:inline">${cat.name}</span>
      </button>`
    ).join("")
  },

  renderCategories() {
    const container = document.getElementById("category-contents")
    container.innerHTML = DATA.categories.map((cat, i) => {
      // Group items
      const groups = {}
      cat.items.forEach(item => {
        if (!groups[item.group]) groups[item.group] = []
        groups[item.group].push(item)
      })

      const groupHtml = Object.entries(groups).map(([groupName, items]) => {
        const isCommonPaper = groupName.includes("Papel comum")
        const isAdh = groupName.includes("Leitoso")

        const rowsHtml = items.map(item => {
          const r = item.rules
          const isItemAdh = r.type === "adhesive"

          let rateDisp = ""
          let typeLabel = ""
          if (r.type === "tiered") {
            rateDisp = r.tiers.map((t, idx) => `R$ ${t.rate.toFixed(2)}${idx < r.tiers.length - 1 ? " | " : ""}`).join("")
            typeLabel = '<span class="text-xs text-gray-400">por quantidade</span>'
          } else if (r.type === "flat") {
            rateDisp = `R$ ${r.rate.toFixed(2)}`
          } else if (r.type === "adhesive") {
            rateDisp = r.tiers.map(t => `R$ ${t.rate.toFixed(2)}/m²`).join(" | ")
            typeLabel = '<span class="text-xs text-gray-400">por m²</span>'
          }

          const dataRules = this.htmlEncode(JSON.stringify(r))

          return `<tr data-rules='${dataRules}' class="hover:bg-gray-50 transition-colors">
            <td class="pl-6 py-4"><span class="font-medium text-gray-800">${item.name}</span></td>
            <td class="text-right py-4">
              <div class="flex flex-col items-end">
                ${typeLabel}
                <span class="font-mono text-xs text-gray-600 rate-display">${rateDisp}</span>
              </div>
            </td>
            <td class="text-right py-4">
              <input type="number" min="0" step="1" value=""
                class="input input-bordered input-sm w-20 text-right font-mono qty-input"
                oninput="Calc.calculateRow(this)" />
            </td>
            ${!isCommonPaper ? `
            <td class="text-center py-4">
              <input type="checkbox"
                class="toggle toggle-xs border-gray-300 bg-gray-200"
                onchange="Calc.calculateRow(this)" />
            </td>` : ""}
            ${isItemAdh ? `
            <td class="text-right py-4">
              <input type="number" min="0" step="0.01" value=""
                class="input input-bordered input-sm w-24 text-right font-mono width-input"
                oninput="Calc.calculateRow(this)" placeholder="0,00" />
            </td>
            <td class="text-right py-4">
              <input type="number" min="0" step="0.01" value=""
                class="input input-bordered input-sm w-24 text-right font-mono height-input"
                oninput="Calc.calculateRow(this)" placeholder="0,00" />
            </td>
            <td class="text-right py-4">
              <span class="font-mono text-sm text-gray-500 m2-display">0,000</span>
            </td>` : ""}
            <td class="pr-6 py-4 text-right">
              <span class="font-mono font-semibold text-gray-900 text-lg subtotal-display">R$ 0,00</span>
            </td>
          </tr>`
        }).join("")

        return `<div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden mb-6">
          <div class="px-6 py-4 bg-gradient-to-r from-gray-50 to-white border-b border-gray-200 flex items-center gap-3">
            <div class="w-1 h-8 rounded-full bg-gradient-to-b from-gray-500 to-gray-700"></div>
            <h3 class="text-lg font-semibold text-gray-800">${groupName}</h3>
            <span class="ml-auto text-sm font-medium text-gray-500">
              Subtotal: <span class="font-mono font-bold text-gray-900 group-total">R$ 0,00</span>
            </span>
          </div>
          <div class="overflow-x-auto">
            <table class="table table-zebra table-pin-rows">
              <thead>
                <tr class="text-sm uppercase tracking-wider text-gray-500">
                  <th class="py-4 pl-6">Item</th>
                  <th class="py-4 text-right">Preço Unit.</th>
                  <th class="py-4 text-right">Qtde.</th>
                  ${!isCommonPaper ? '<th class="py-4 text-center">Corte?</th>' : ''}
                  ${isAdh ? '<th class="py-4 text-right">Largura (m)</th><th class="py-4 text-right">Altura (m)</th><th class="py-4 text-right">m²</th>' : ''}
                  <th class="py-4 pr-6 text-right">Subtotal</th>
                </tr>
              </thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          </div>
        </div>`
      }).join("")

      return `<div class="cat-content ${i === 0 ? '' : 'hidden'}" data-cat="${cat.id}">
        ${groupHtml}
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 flex justify-end items-center gap-6">
          <span class="text-xl font-medium text-gray-500">Total ${cat.name}</span>
          <span class="text-2xl font-bold text-gray-900 cat-total">R$ 0,00</span>
        </div>
      </div>`
    }).join("")
  },

  htmlEncode(str) {
    return str.replace(/'/g, "&#39;").replace(/"/g, "&quot;")
  },

  // ── TAB SWITCHING ──

  switchTab(id) {
    document.querySelectorAll("#category-tabs .tab").forEach(t => {
      t.classList.remove("tab-active", "bg-gray-900", "text-white")
      t.classList.add("hover:bg-gray-100")
    })
    event.target.classList.add("tab-active", "bg-gray-900", "text-white")
    event.target.classList.remove("hover:bg-gray-100")

    document.querySelectorAll(".cat-content").forEach(el => el.classList.add("hidden"))
    const target = document.querySelector(`.cat-content[data-cat="${id}"]`)
    if (target) target.classList.remove("hidden")
  },

  // ── CALCULATION ──

  calculateRow(input) {
    const row = input.closest("tr")
    if (!row) return

    const rules = JSON.parse(row.dataset.rules)
    const qty = parseFloat(row.querySelector(".qty-input")?.value) || 0

    let subtotal = 0
    let displayPrice = ""

    if (rules.type === "flat") {
      subtotal = qty * rules.rate
      displayPrice = `R$ ${rules.rate.toFixed(2)}`
    } else if (rules.type === "tiered") {
      const rate = this.findTieredRate(qty, rules.tiers)
      subtotal = qty * rate
      displayPrice = `R$ ${rate.toFixed(2)}`
    } else if (rules.type === "adhesive") {
      const width = parseFloat(row.querySelector(".width-input")?.value) || 0
      const height = parseFloat(row.querySelector(".height-input")?.value) || 0
      const bleed = rules.bleed || 0

      if (width > 0 && height > 0) {
        const m2 = (width + bleed) * (height + bleed) * qty
        const rate = this.findAdhesiveRate(m2, rules.tiers)
        subtotal = Math.max(m2 * rate, rules.min_charge || 0)
        const m2El = row.querySelector(".m2-display")
        if (m2El) m2El.textContent = m2.toFixed(3)
      }
      displayPrice = rules.tiers.map(t => `R$ ${t.rate.toFixed(2)}/m²`).join(" | ")
    }

    // Cutting surcharge
    const cutCb = row.querySelector(".toggle")
    if (cutCb && cutCb.checked && qty > 0) subtotal += qty * 1.00

    const subEl = row.querySelector(".subtotal-display")
    if (subEl) subEl.textContent = this.fmt(subtotal)

    const rdEl = row.querySelector(".rate-display")
    if (rdEl) rdEl.textContent = displayPrice

    this.recalc()
  },

  findTieredRate(qty, tiers) {
    for (const t of tiers) { if (qty >= t.min_qty) return t.rate }
    return tiers[tiers.length - 1]?.rate || 0
  },

  findAdhesiveRate(m2, tiers) {
    for (const t of tiers) { if (m2 >= t.min_m2) return t.rate }
    return tiers[tiers.length - 1]?.rate || 0
  },

  recalc() {
    let total = 0

    // Sum all subtotals
    document.querySelectorAll(".subtotal-display").forEach(el => {
      total += this.parse(el.textContent)
    })

    // Add custom services
    document.querySelectorAll(".custom-price").forEach(el => {
      total += this.parse(el.textContent)
    })

    // Update grand totals
    document.querySelectorAll(".grand-total").forEach(el => {
      el.textContent = this.fmt(total)
    })

    // Group totals
    document.querySelectorAll("[data-group-id]").forEach(group => {
      let gt = 0
      group.querySelectorAll(".subtotal-display").forEach(el => {
        gt += this.parse(el.textContent)
      })
      const el = group.querySelector(".group-total")
      if (el) el.textContent = this.fmt(gt)
    })

    // Category totals
    document.querySelectorAll(".cat-content").forEach(cat => {
      let ct = 0
      cat.querySelectorAll(".subtotal-display").forEach(el => {
        ct += this.parse(el.textContent)
      })
      const el = cat.querySelector(".cat-total")
      if (el) el.textContent = this.fmt(ct)
    })

    // Custom services total
    let cst = 0
    document.querySelectorAll(".custom-price").forEach(el => {
      cst += this.parse(el.textContent)
    })
    const cstEl = document.getElementById("custom-services-total")
    if (cstEl) cstEl.textContent = this.fmt(cst)
  },

  fmt(value) {
    return new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }).format(value)
  },

  parse(value) {
    if (!value) return 0
    return parseFloat(value.replace(/[R$\s]/g, "").replace(/\./g, "").replace(",", ".")) || 0
  },

  // ── CUSTOM SERVICES ──

  addCustomService() {
    const nameInput = document.getElementById("custom-service-name")
    const priceInput = document.getElementById("custom-service-price")
    const name = nameInput?.value?.trim()
    const price = parseFloat(priceInput?.value) || 0

    if (!name) { nameInput?.focus(); nameInput?.classList.add("input-error"); setTimeout(() => nameInput?.classList.remove("input-error"), 1000); return }
    if (price <= 0) { priceInput?.focus(); priceInput?.classList.add("input-error"); setTimeout(() => priceInput?.classList.remove("input-error"), 1000); return }

    const list = document.getElementById("custom-services-list")
    const id = `cs-${Date.now()}`
    const row = document.createElement("div")
    row.id = id
    row.className = "flex items-center justify-between p-3 bg-white rounded-xl border border-gray-200 slide-up"
    row.innerHTML = `<div class="flex items-center gap-3 min-w-0 flex-1">
      <i class="fas fa-cog text-gray-400"></i>
      <span class="font-medium text-gray-800 truncate">${this.escHtml(name)}</span>
    </div>
    <div class="flex items-center gap-4">
      <span class="font-mono font-semibold text-lg text-gray-900 custom-price">${this.fmt(price)}</span>
      <button class="btn btn-ghost btn-xs btn-square text-gray-400 hover:text-red-500" onclick="Calc.removeCustomService('${id}')">
        <i class="fas fa-times"></i>
      </button>
    </div>`
    list.appendChild(row)
    nameInput.value = ""
    priceInput.value = ""
    this.recalc()
    nameInput.focus()
  },

  removeCustomService(id) {
    const row = document.getElementById(id)
    if (row) {
      row.style.transition = "all 0.2s ease-out"
      row.style.opacity = "0"
      row.style.transform = "translateX(20px)"
      setTimeout(() => { row.remove(); this.recalc() }, 200)
    }
  },

  escHtml(str) {
    const d = document.createElement("div"); d.textContent = str; return d.innerHTML
  },

  // ── PRINT RECEIPT ──

  printReceipt() {
    const data = this.collectData()
    const w = window.open("", "_blank", "width=800,height=600")

    let html = `<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Recibo - Calculadora Xerox do Victor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<style>
  @page { margin: 15mm; }
  body { font-family: 'Inter', sans-serif; color: #1f2937; background: #fff; padding: 0; margin: 0; }
  .receipt { max-width: 700px; margin: 0 auto; padding: 32px 24px; }
  .header { text-align: center; border-bottom: 2px solid #1f2937; padding-bottom: 20px; margin-bottom: 24px; }
  .header h1 { font-size: 24px; font-weight: 800; margin: 0 0 4px 0; text-transform: uppercase; letter-spacing: 0.05em; }
  .header p { color: #6b7280; font-size: 14px; margin: 0; }
  .section-title { font-size: 14px; font-weight: 700; text-transform: uppercase; color: #6b7280; margin: 20px 0 8px 0; padding-bottom: 4px; border-bottom: 1px solid #e5e7eb; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 6px 4px; font-weight: 600; color: #6b7280; font-size: 11px; text-transform: uppercase; border-bottom: 1px solid #e5e7eb; }
  th:last-child, td:last-child { text-align: right; }
  td { padding: 5px 4px; border-bottom: 1px solid #f3f4f6; }
  .mono { font-family: 'Courier New', monospace; }
  .grand td { font-weight: 700; font-size: 18px; border-top: 3px double #1f2937; padding-top: 10px; }
  .footer { text-align: center; margin-top: 32px; padding-top: 16px; border-top: 1px solid #e5e7eb; font-size: 12px; color: #9ca3af; }
  @media print { body { -webkit-print-color-adjust: exact; } }
</style></head><body>
<div class="receipt">
  <div class="header"><h1>Calculadora Xerox do Victor</h1><p>Recibo de Orçamento</p></div>`

    data.categories.forEach(cat => {
      if (!cat.items.length) return
      html += `<div class="section-title">${cat.name}</div>
<table><thead><tr><th>Item</th><th>Qtd</th><th>Preço</th><th>Subtotal</th></tr></thead><tbody>`
      cat.items.forEach(i => {
        html += `<tr><td>${i.name}</td><td>${i.qty}</td><td class="mono">${i.price}</td><td class="mono">${i.subtotal}</td></tr>`
      })
      html += `</tbody></table>`
    })

    if (data.custom.length) {
      html += `<div class="section-title">Outros Serviços</div>
<table><thead><tr><th>Serviço</th><th colspan="2"></th><th>Valor</th></tr></thead><tbody>`
      data.custom.forEach(s => { html += `<tr><td>${s.name}</td><td colspan="2"></td><td class="mono">${s.price}</td></tr>` })
      html += `</tbody></table>`
    }

    html += `<table><tfoot><tr class="grand"><td colspan="3">TOTAL GERAL</td><td class="mono">${this.fmt(data.total)}</td></tr></tfoot></table>
<div class="footer">
  <p>Gerado em ${new Date().toLocaleDateString("pt-BR", { day:"numeric", month:"long", year:"numeric", hour:"2-digit", minute:"2-digit" })}</p>
  <p>Calculadora Xerox do Victor &mdash; Obrigado pela preferência!</p>
</div>
</div>
<script>window.onload=function(){window.print()}<\/script>
</body></html>`

    w.document.write(html)
    w.document.close()
  },

  collectData() {
    const cats = []
    document.querySelectorAll(".cat-content").forEach(el => {
      const tabBtn = document.querySelector(`[onclick="Calc.switchTab(${el.dataset.cat})"]`)
      const name = tabBtn?.textContent?.trim() || "Categoria"
      const items = []
      el.querySelectorAll("tr[data-rules]").forEach(row => {
        const qty = parseFloat(row.querySelector(".qty-input")?.value) || 0
        if (qty <= 0) return
        items.push({
          name: row.querySelector(".font-medium")?.textContent?.trim() || "Item",
          qty,
          price: row.querySelector(".rate-display")?.textContent || "",
          subtotal: row.querySelector(".subtotal-display")?.textContent || "R$ 0,00"
        })
      })
      if (items.length) cats.push({ name, items })
    })

    const custom = []
    document.querySelectorAll("#custom-services-list > div").forEach(row => {
      const n = row.querySelector(".font-medium")?.textContent?.trim()
      const p = row.querySelector(".custom-price")?.textContent?.trim()
      if (n && p) custom.push({ name: n, price: p })
    })

    return { categories: cats, custom, total: this.parse(document.querySelector(".grand-total")?.textContent || "R$ 0,00") }
  }
}

// ── INIT ──
document.addEventListener("DOMContentLoaded", () => Calc.init())
</script>

</body>
</html>
