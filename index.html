<title>Calculadora Xerox do Victor</title>
<style>
/* ===================================================================
   1) RESET & BASE
   =================================================================== */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f3f4f6;color:#111827}

/* ===================================================================
   2) COMPONENTS (minimal hand-written replacement for DaisyUI)
   =================================================================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:0.5rem;
  border-radius:0.5rem;font-weight:600;line-height:1.25rem;font-size:0.875rem;
  padding:0.5rem 1rem;border:1px solid transparent;cursor:pointer;
  background-color:#e5e7eb;color:#111827;white-space:nowrap}
.btn-sm{padding:0.375rem 0.75rem;font-size:0.8125rem;min-height:2rem;height:2rem}
.btn-xs{padding:0.125rem 0.5rem;font-size:0.75rem;min-height:1.5rem;height:1.5rem}
.btn-outline{background-color:transparent;border-color:#d1d5db;color:#111827}
.btn-outline:hover{background-color:#f3f4f6}

.input{display:inline-flex;align-items:center;width:100%;border-radius:0.375rem;
  border:1px solid #d1d5db;padding:0 0.5rem;font-size:0.875rem;background:#fff}
.input-bordered{border-color:#d1d5db}
.input-xs{height:1.5rem;font-size:0.75rem;padding:0 0.375rem}

.toggle{--tglbg:#fff;appearance:none;display:inline-block;position:relative;
  width:2.25rem;height:1.25rem;border-radius:9999px;background-color:#d1d5db;
  border:1px solid rgba(0,0,0,.1);cursor:pointer;transition:background-color .2s}
.toggle::before{content:"";position:absolute;top:50%;left:0.125rem;
  transform:translateY(-50%);width:1rem;height:1rem;border-radius:9999px;
  background:var(--tglbg,#fff);transition:left .2s}
.toggle:checked{background-color:#111827!important}
.toggle:checked::before{left:calc(100% - 1.125rem)}
.toggle-xs{width:1.75rem;height:1rem}
.toggle-xs::before{width:0.75rem;height:0.75rem}
.toggle-xs:checked::before{left:calc(100% - 0.875rem)}

/* ===================================================================
   3) UTILITIES (minimal hand-written replacement for Tailwind —
   only the classes actually used on this page)
   =================================================================== */
/* layout / display */
.flex{display:flex}
.flex-1{flex:1 1 0%}
.flex-col{flex-direction:column}
.hidden{display:none}
.fixed{position:fixed}
.relative{position:relative}
.sticky{position:sticky}
.top-0{top:0}
.inset-0{top:0;right:0;bottom:0;left:0}
.min-h-screen{min-height:100vh}
.overflow-hidden{overflow:hidden}
.overflow-y-auto{overflow-y:auto}
.z-10{z-index:10}
.z-50{z-index:50}
.z-20{z-index:20}

/* flex alignment */
.items-center{align-items:center}
.items-start{align-items:flex-start}
.justify-between{justify-content:space-between}
.justify-center{justify-content:center}
.justify-end{justify-content:flex-end}
.gap-1{gap:.25rem}
.gap-2{gap:.5rem}
.gap-3{gap:.75rem}
.gap-4{gap:1rem}
.space-y-4>*+*{margin-top:1rem}

/* sizing */
.w-1{width:.25rem}
.w-full{width:100%}
.h-6{height:1.5rem}
.h-9{height:2.25rem}
.max-w-2xl{max-width:42rem}
.max-w-7xl{max-width:80rem}

/* spacing */
.mx-auto{margin-left:auto;margin-right:auto}
.mx-6{margin-left:1.5rem;margin-right:1.5rem}
.ml-auto{margin-left:auto}
.mb-4{margin-bottom:1rem}
.mt-2{margin-top:.5rem}
.mt-6{margin-top:1.5rem}
.my-8{margin-top:2rem;margin-bottom:2rem}
.p-1{padding:.25rem}
.p-3{padding:.75rem}
.p-4{padding:1rem}
.p-5{padding:1.25rem}
.px-2{padding-left:.5rem;padding-right:.5rem}
.px-3{padding-left:.75rem;padding-right:.75rem}
.px-4{padding-left:1rem;padding-right:1rem}
.px-5{padding-left:1.25rem;padding-right:1.25rem}
.px-6{padding-left:1.5rem;padding-right:1.5rem}
.py-1\.5{padding-top:.375rem;padding-bottom:.375rem}
.py-2{padding-top:.5rem;padding-bottom:.5rem}
.py-3{padding-top:.75rem;padding-bottom:.75rem}
.py-4{padding-top:1rem;padding-bottom:1rem}
.py-5{padding-top:1.25rem;padding-bottom:1.25rem}
.pt-4{padding-top:1rem}
.pt-8{padding-top:2rem}
.pt-14{padding-top:3.5rem}
.pb-2{padding-bottom:.5rem}
.pb-4{padding-bottom:1rem}
.pb-6{padding-bottom:1.5rem}

/* borders */
.border{border:1px solid #e5e7eb}
.border-b{border-bottom:1px solid #e5e7eb}
.border-t{border-top:1px solid #e5e7eb}
.border-none{border:none}
.border-gray-100{border-color:#f3f4f6}
.border-gray-200{border-color:#e5e7eb}
.rounded-full{border-radius:9999px}
.rounded-lg{border-radius:.5rem}
.rounded-b-lg{border-bottom-left-radius:.5rem;border-bottom-right-radius:.5rem}
.rounded-md{border-radius:.375rem}
.shadow-sm{box-shadow:0 1px 2px 0 rgba(0,0,0,.05)}
.shadow-xl{box-shadow:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1)}

/* typography */
.text-2xl{font-size:1.5rem;line-height:2rem}
.text-3xl{font-size:1.875rem;line-height:2.25rem}
.text-xl{font-size:1.25rem;line-height:1.75rem}
.text-lg{font-size:1.125rem;line-height:1.75rem}
.text-sm{font-size:.875rem;line-height:1.25rem}
.text-base{font-size:1rem;line-height:1.5rem}
.text-xs{font-size:.75rem;line-height:1rem}
.font-bold{font-weight:700}
.font-semibold{font-weight:600}
.font-medium{font-weight:500}
.text-center{text-align:center}
.text-left{text-align:left}
.text-right{text-align:right}
.uppercase{text-transform:uppercase}
.whitespace-nowrap{white-space:nowrap}
.cursor-pointer{cursor:pointer}
.transition{transition:color,background-color,border-color,box-shadow,transform .15s cubic-bezier(.4,0,.2,1)}

/* colors - text */
.text-white{color:#fff}
.text-gray-400{color:#9ca3af}
.text-gray-500{color:#6b7280}
.text-gray-600{color:#4b5563}
.text-gray-700{color:#374151}
.text-gray-900{color:#111827}
.text-red-600{color:#dc2626}

/* colors - background */
.bg-white{background-color:#fff}
.bg-gray-50{background-color:#f9fafb}
.bg-gray-50\/50{background-color:rgba(249,250,251,.5)}
.bg-gray-500{background-color:#6b7280}
.bg-gray-800{background-color:#1f2937}
.bg-gray-900{background-color:#111827}

/* hover states */
.hover\:bg-gray-100:hover{background-color:#f3f4f6}
.hover\:bg-gray-200:hover{background-color:#e5e7eb}
.hover\:bg-gray-700:hover{background-color:#374151}
.hover\:bg-gray-800:hover{background-color:#1f2937}
.hover\:text-red-600:hover{color:#dc2626}

/* ===================================================================
   4) PROJECT-SPECIFIC STYLES
   =================================================================== */
table{width:100%;border-collapse:collapse}
th,td{padding:8px 12px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:16px}
th:last-child,td:last-child{padding-right:16px}
tbody tr:not(:last-child){border-bottom:1px solid #e5e7eb}
tbody tr:hover{background:#f9fafb}
input[type="number"]::-webkit-inner-spin-button,input[type="number"]::-webkit-outer-spin-button{opacity:0.4}
.col-qty{width:80px;min-width:80px}
.col-price{width:140px;min-width:140px}
.col-cut{width:60px;min-width:60px;text-align:center}
.col-sub{width:110px;min-width:110px}
.campo-label{width:80px;flex-shrink:0}
.os-label{width:110px;flex-shrink:0}
#reciboModal.hidden{display:none}
#osModal.hidden{display:none}
@media print{
  #app{display:none!important}
  .no-print{display:none!important}
  #reciboModal:not(.hidden), #osModal:not(.hidden){display:block!important;position:static!important;background:#fff!important;padding:0!important;margin:0!important}
  #reciboModal *, #osModal *{min-height:0!important}
  #reciboModal>div, #osModal>div{margin:0!important;padding:0!important;display:block!important}
  #reciboModal .bg-white.rounded-lg, #osModal .bg-white.rounded-lg{margin:0!important;box-shadow:none!important;max-width:100%!important}
  @page{margin:10mm}
}
</style>
</head>
<body>

<div id="app" class="min-h-screen">

    </div>
  </div>

  <div class="max-w-7xl mx-auto px-4 pt-14 pb-4">

    </div>

    <!-- Tabs -->
    <div class="flex gap-1 mb-4 bg-white border border-gray-200 rounded-lg p-1 shadow-sm" id="tabs"></div>

    <!-- Categories -->
    <div id="contents"></div>
  </div>
</div>

<!-- Recibo Modal -->
<div id="reciboModal" class="hidden fixed inset-0 z-50 overflow-y-auto" style="background:rgba(0,0,0,0.6)">
  <div class="min-h-screen flex items-start justify-center p-4">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl my-8 overflow-hidden">
      <div id="reciboBody"></div>
      <div class="no-print flex gap-2 justify-end p-4 border-t border-gray-200 bg-gray-50">
        <button onclick="fecharRecibo()" class="btn btn-sm btn-outline">Fechar</button>
        <button onclick="window.print()" class="btn btn-sm bg-gray-900 text-white hover:bg-gray-800 border-none">Imprimir</button>
      </div>
    </div>
  </div>
</div>

<!-- Ordem de Serviço Modal -->
<div id="osModal" class="hidden fixed inset-0 z-50 overflow-y-auto" style="background:rgba(0,0,0,0.6)">
  <div class="min-h-screen flex items-start justify-center p-4">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl my-8 overflow-hidden">

        <div class="flex items-center gap-3">

          <input type="text" id="osNota" class="input input-bordered w-full bg-white px-3 py-2" placeholder="A ser preenchido pelo designer">
        </div>
        <div class="flex items-center gap-3">
          <label class="text-sm font-medium text-gray-700 whitespace-nowrap os-label">Cliente:</label>
          <input type="text" id="osCliente" class="input input-bordered w-full bg-white px-3 py-2">
        </div>
        <div class="flex items-center gap-3">
          <label class="text-sm font-medium text-gray-700 whitespace-nowrap os-label">Designer:</label>
          <input type="text" id="osDesigner" class="input input-bordered w-full bg-white px-3 py-2">
        </div>
        <div class="flex items-center gap-3">
          <label class="text-sm font-medium text-gray-700 whitespace-nowrap os-label">Entrega:</label>
          <input type="datetime-local" id="osEntrega" class="input input-bordered w-full bg-white px-3 py-2">
        </div>

        <div id="osItemsContainer" class="flex flex-col gap-3"></div>
        <div class="no-print">

      <div class="no-print flex gap-2 justify-end p-4 border-t border-gray-200 bg-gray-50">

        <button onclick="window.print()" class="btn btn-sm bg-gray-900 text-white hover:bg-gray-800 border-none">Imprimir</button>
      </div>
    </div>
  </div>
</div>

// ========== HELPERS ==========
const fmt = v => new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(v);
const parse = v => { if(!v)return 0; const c=v.replace(/[R$\s]/g,"").replace(/\./g,"").replace(",","."); return parseFloat(c)||0; };
const findRate = (q,t)=>{for(const r of t)if(q>=r.min_qty)return r.rate;return t[t.length-1]?.rate||0};
const findAdh = (m,t)=>{for(const r of t)if(m>=r.min_m2)return r.rate;return t[t.length-1]?.rate||0};
const findRateIdx = (q,t)=>{for(let i=0;i<t.length;i++)if(q>=t[i].min_qty)return i;return t.length-1};
const findAdhIdx = (m,t)=>{for(let i=0;i<t.length;i++)if(m>=t[i].min_m2)return i;return t.length-1};
const escapeHtml = s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function recalc(){
  let total=0;
  document.querySelectorAll("[data-st]").forEach(el=>total+=parse(el.textContent));
  document.getElementById("grandTotal").textContent=fmt(total);
  document.querySelectorAll("[data-group]").forEach(g=>{
    let t=0;g.querySelectorAll("[data-st]").forEach(e=>t+=parse(e.textContent));
    const el=g.querySelector("[data-gt]");if(el)el.textContent=fmt(t);
  });
  document.querySelectorAll("[data-cat]").forEach(c=>{
    let t=0;c.querySelectorAll("[data-st]").forEach(e=>t+=parse(e.textContent));
    const el=c.querySelector("[data-ct]");if(el)el.textContent=fmt(t);
  });
}

// Mostra/esconde o dropdown de opções de corte (ex: máquina vs manual)
// quando o toggle de corte é ativado/desativado.
function onCutToggle(checkbox){
  const row=checkbox.closest("[data-rules]");
  const select=row.querySelector("[data-cut-options]");
  if(select) select.style.display=checkbox.checked?"inline-block":"none";
  calcRow(row);
}

function calcRow(row){
  const rules=JSON.parse(row.dataset.rules);

  if(rules.type==="adhesive"){
    recalcAdhesiveGroup(row.closest("[data-group]"));
    return;
  }
  if(rules.type==="canvas"){
    calcCanvasRow(row,rules);
    return;
  }
  if(rules.type==="tiered_cut"){
    calcTieredCutRow(row,rules);
    return;
  }

  const qty=parseFloat(row.querySelector("[data-qty]")?.value)||0;
  let sub=0;
  let activeIdx=-1;
  if(rules.type==="flat"){
    sub=qty*rules.rate;
  } else if(rules.type==="variable"){
    const unitPrice=parseFloat(row.querySelector("[data-unit-price]")?.value)||0;
    sub=qty*unitPrice;
  } else if(rules.type==="tiered"){
    if(qty>0){
      activeIdx=findRateIdx(qty,rules.tiers);
      let rate=rules.tiers[activeIdx].rate;
      if(rules.duplex){
        const duplexChecked=row.querySelector("[data-duplex]")?.checked;
        if(duplexChecked&&qty>=rules.duplex.min_qty){
          rate=Math.max(0,rate-rules.duplex.discount);
        }
      }
      sub=qty*rate;
    }
  }
  row.querySelectorAll(".tier-rate").forEach((el,i)=>{
    el.classList.toggle("font-bold",i===activeIdx);
    el.classList.toggle("text-gray-900",i===activeIdx);
  });
  const cut=row.querySelector("[data-cut]");
  const cutOptionsSelect=row.querySelector("[data-cut-options]");
  const cutPrice=cutOptionsSelect?(parseFloat(cutOptionsSelect.value)||0):(rules.cut_price??1);
  if(cut&&cut.checked&&qty>0) sub+=qty*cutPrice;
  const st=row.querySelector("[data-st]");if(st)st.textContent=fmt(sub);
  recalc();
}

// Recalcula um grupo de adesivos somando o m² de todas as linhas (mesmo tipo)
// para aplicar o desconto por quantidade de forma conjunta, e distribui o
// valor proporcionalmente entre as linhas.
function recalcAdhesiveGroup(groupEl){
  if(!groupEl) return;
  const rows=[...groupEl.querySelectorAll("tr[data-rules]")];
  if(rows.length===0) return;
  const rules=JSON.parse(rows[0].dataset.rules);
  const b=rules.bleed||0;

  const rowM2=rows.map(row=>{
    const w=parseFloat(row.querySelector("[data-w]")?.value)||0;
    const h=parseFloat(row.querySelector("[data-h]")?.value)||0;
    const qty=parseFloat(row.querySelector("[data-qty]")?.value)||0;
    const m2=(w>0&&h>0&&qty>0)?(w+b)*(h+b)*qty:0;
    const e=row.querySelector("[data-m2]");if(e)e.textContent=m2.toFixed(3);
    return m2;
  });

  const totalM2=rowM2.reduce((a,c)=>a+c,0);
  let activeIdx=-1,rate=0;
  if(totalM2>0){
    activeIdx=findAdhIdx(totalM2,rules.tiers);
    rate=rules.tiers[activeIdx].rate;
  }
  const rawTotal=totalM2*rate;
  const finalTotal=totalM2>0?Math.max(rawTotal,rules.min_charge||0):0;
  const scale=rawTotal>0?finalTotal/rawTotal:0;

  rows.forEach((row,i)=>{
    let sub=totalM2>0?rowM2[i]*rate*scale:0;
    if(rowM2[i]>0){
      (rules.finishings||[]).forEach(f=>{
        const chk=row.querySelector(`[data-finishing="${f.key}"]`);
        if(chk&&chk.checked){
          if(f.condition==="m2<=1"){
            if(rowM2[i]<=1) sub+=f.price;
          } else {
            sub+=f.price;
          }
        }
      });
    }
    const st=row.querySelector("[data-st]");if(st)st.textContent=fmt(sub);
    row.querySelectorAll(".tier-rate").forEach((el,idx)=>{
      el.classList.toggle("font-bold",totalM2>0&&idx===activeIdx);
      el.classList.toggle("text-gray-900",totalM2>0&&idx===activeIdx);
    });
  });

  recalc();
}

// Calcula o preço do Canvas: cobrado por metro linear (não por m²), limitado
// pela largura do rolo (max_roll). Se as duas medidas excederem o rolo, a
// impressão não é possível.
function calcCanvasRow(row,rules){
  const w=parseFloat(row.querySelector("[data-w]")?.value)||0;
  const h=parseFloat(row.querySelector("[data-h]")?.value)||0;
  const st=row.querySelector("[data-st]");
  const maxRoll=rules.max_roll;

  row.dataset.canvasError="0";

  if(w<=0||h<=0){
    if(st) st.textContent=fmt(0);
    recalc();
    return;
  }

  if(w>maxRoll&&h>maxRoll){
    row.dataset.canvasError="1";
    if(st) st.innerHTML=`<span style="color:#dc2626;font-weight:600">Impressão não é possível</span>`;
    recalc();
    return;
  }

  let valor;
  if(w<=maxRoll&&h<=maxRoll){
    valor=rules.rate*Math.min(w,h);
  } else {
    valor=rules.rate*Math.max(w,h);
  }
  if(st) st.textContent=fmt(valor);
  recalc();
}

// Calcula itens tiered em que o corte muda a própria faixa de preço
// (não é um adicional fixo, é uma tabela sem-corte/com-corte por faixa).
function calcTieredCutRow(row,rules){
  const qty=parseFloat(row.querySelector("[data-qty]")?.value)||0;
  const cutChecked=row.querySelector("[data-cut]")?.checked;
  let sub=0;
  let activeIdx=-1;
  if(qty>0){
    activeIdx=rules.tiers.findIndex(t=>qty>=t.min_qty);
    if(activeIdx>=0){
      const tier=rules.tiers[activeIdx];
      const rate=cutChecked?tier.rate_com:tier.rate_sem;
      sub=qty*rate;
    }
  }
  row.querySelectorAll(".tier-rate").forEach((el,i)=>{
    el.classList.toggle("font-bold",qty>0&&i===activeIdx);
    el.classList.toggle("text-gray-900",qty>0&&i===activeIdx);
  });
  const st=row.querySelector("[data-st]");if(st)st.textContent=fmt(sub);
  recalc();
}

// Duplica uma linha de item (mesmo tipo), zerando os valores, para permitir
// múltiplos itens do mesmo tipo (ex: dimensões diferentes de adesivo, ou
// folhas com e sem corte do mesmo papel).
function duplicarLinha(btn){
  const originalRow=btn.closest("tr[data-rules]");
  const tbody=originalRow.closest("tbody");
  const itemId=originalRow.dataset.itemId;
  const newRow=originalRow.cloneNode(true);

  newRow.querySelectorAll("input[type='number']").forEach(inp=>inp.value="");
  newRow.querySelectorAll("input[type='checkbox']").forEach(inp=>inp.checked=false);
  const m2cell=newRow.querySelector("[data-m2]");if(m2cell)m2cell.textContent="0,000";
  const stCell=newRow.querySelector("[data-st]");if(stCell)stCell.textContent=fmt(0);
  newRow.querySelectorAll(".tier-rate").forEach(el=>el.classList.remove("font-bold","text-gray-900"));
  newRow.dataset.canvasError="0";
  const cutSelect=newRow.querySelector("[data-cut-options]");
  if(cutSelect){cutSelect.style.display="none";cutSelect.selectedIndex=0;}

  originalRow.after(newRow);
  atualizarBotoesRemover(tbody,itemId);
  recalc();
}

function removerLinha(btn){
  const row=btn.closest("tr[data-rules]");
  const tbody=row.closest("tbody");
  const itemId=row.dataset.itemId;
  const rules=JSON.parse(row.dataset.rules);
  const groupEl=row.closest("[data-group]");
  row.remove();
  atualizarBotoesRemover(tbody,itemId);
  if(rules.type==="adhesive"){
    recalcAdhesiveGroup(groupEl);
  } else {
    recalc();
  }
}

function atualizarBotoesRemover(tbody,itemId){
  const rows=tbody.querySelectorAll(`tr[data-item-id="${itemId}"]`);
  rows.forEach(row=>{
    const btn=row.querySelector(".remove-linha-btn");
    if(btn) btn.style.display=rows.length>1?"inline-block":"none";
  });
}

function calcOutro(input){
  const row=input.closest("tr");
  const val=parseFloat(row.querySelector("[data-val]").value)||0;
  const qtd=parseFloat(row.querySelector("[data-qtd]").value)||0;
  const isDesconto=row.querySelector("[data-desconto]")?.checked;
  const sub=isDesconto?-(val*qtd):(val*qtd);
  const st=row.querySelector("[data-st]");
  st.textContent=fmt(sub);
  st.classList.toggle("text-red-600",sub<0);
  recalc();
}
function removeOutro(btn){
  btn.closest("tr").remove();
  recalc();
}
addOutroItem();

// ========== DESIGNER (persiste no navegador, exibido como "conta logada") ==========
const DESIGNER_KEY="xerox_designer_nome";
function getDesignerName(){
  try{ return localStorage.getItem(DESIGNER_KEY)||""; }catch(e){ return ""; }
}
function setDesignerName(name){
  try{ localStorage.setItem(DESIGNER_KEY,name); }catch(e){}
}
function atualizarBadgeDesigner(){
  const name=getDesignerName();
  document.getElementById("designerBadgeName").textContent=name||"não definido";
}
function renomearDesigner(){
  const atual=getDesignerName();
  const novo=prompt("Nome do designer:",atual);
  if(novo===null) return;
  setDesignerName(novo.trim());
  atualizarBadgeDesigner();
}
atualizarBadgeDesigner();

// ========== LIMPAR TUDO ==========
// Clique na logo: limpa tudo e volta para a primeira aba (Color)
function logoClick(){
  limparTudo();
  const firstTabBtn=tabsEl.querySelector("button");
  if(firstTabBtn) firstTabBtn.click();
}

// Esc: se um modal (recibo/OS) estiver aberto, apenas fecha ele.
// Caso contrário, tem o mesmo efeito de clicar na logo (limpa tudo e volta pro Color).
document.addEventListener("keydown",function(e){
  if(e.key!=="Escape") return;
  const recibo=document.getElementById("reciboModal");
  const os=document.getElementById("osModal");
  if(recibo&&!recibo.classList.contains("hidden")){
    fecharRecibo();
    return;
  }
  if(os&&!os.classList.contains("hidden")){
    fecharOS();
    return;
  }
  logoClick();
});

function limparTudo(){
  document.querySelectorAll("[data-qty]").forEach(el=>el.value="");
  document.querySelectorAll("[data-w]").forEach(el=>el.value="");
  document.querySelectorAll("[data-h]").forEach(el=>el.value="");
  document.querySelectorAll("[data-cut]").forEach(el=>el.checked=false);
  document.querySelectorAll("[data-duplex]").forEach(el=>el.checked=false);
  document.querySelectorAll("[data-colaborador]").forEach(el=>el.value="");
  document.querySelectorAll("[data-m2]").forEach(el=>el.textContent="0,000");
  document.querySelectorAll("[data-st]").forEach(el=>el.textContent=fmt(0));
  document.querySelectorAll(".tier-rate").forEach(el=>el.classList.remove("font-bold","text-gray-900"));

  document.getElementById("outrosBody").innerHTML="";
  addOutroItem();

  const clienteEl=document.getElementById("clienteNome");
  if(clienteEl) clienteEl.value="";

  recalc();
}

// ========== RECIBO ==========
function gerarRecibo(){
  const linhas=[];

  document.querySelectorAll("[data-cat]").forEach(catDiv=>{
    const catId=catDiv.dataset.cat;
    if(catId==="outros"){
      catDiv.querySelectorAll("#outrosBody tr").forEach(tr=>{
        const desc=(tr.querySelector("[data-desc]")?.value||"").trim();
        const val=parseFloat(tr.querySelector("[data-val]")?.value)||0;
        const qtd=parseFloat(tr.querySelector("[data-qtd]")?.value)||0;
        const isDesconto=tr.querySelector("[data-desconto]")?.checked;
        if(desc&&val>0&&qtd>0){
          const subVal=isDesconto?-(val*qtd):(val*qtd);
          const unitVal=isDesconto?-val:val;
          linhas.push({categoria:"Outros serviços",item:desc+(isDesconto?" (desconto)":""),qtd:qtd,unit:fmt(unitVal),sub:fmt(subVal)});
        }
      });
    } else {
      const cat=categories.find(c=>String(c.id)===String(catId));
      catDiv.querySelectorAll("tr[data-rules]").forEach(tr=>{
        const rules=JSON.parse(tr.dataset.rules);
        const groupName=tr.closest("[data-group]")?.dataset.group||"";
        const name=tr.querySelector("td").textContent.trim();
        const subEl=tr.querySelector("[data-st]");

        if(rules.type==="canvas"){
          const w=parseFloat(tr.querySelector("[data-w]")?.value)||0;
          const h=parseFloat(tr.querySelector("[data-h]")?.value)||0;
          const temErro=tr.dataset.canvasError==="1";
          if(w>0&&h>0&&!temErro){
            const sub=subEl?subEl.textContent:fmt(0);
            linhas.push({categoria:(cat?cat.name+" - ":"")+groupName,item:`${w}m × ${h}m`,qtd:1,unit:sub,sub:sub});
          }
          return;
        }

        const qty=parseFloat(tr.querySelector("[data-qty]")?.value)||0;
        if(qty>0){
          const sub=subEl?subEl.textContent:fmt(0);
          const cutEl=tr.querySelector("[data-cut]");
          const cutTxt=(cutEl&&cutEl.checked)?" + corte":"";
          const duplexEl=tr.querySelector("[data-duplex]");
          const duplexTxt=(duplexEl&&duplexEl.checked)?" + frente e verso":"";
          const colabEl=tr.querySelector("[data-colaborador]");
          let colabTxt="";
          if(colabEl){
            const colabVal=(colabEl.value||"").trim();
            colabTxt=colabVal?` — Colaborador: ${colabVal}`:` — Colaborador: ______________`;
          }
          const unitVal=qty>0?parse(sub)/qty:0;
          linhas.push({categoria:(cat?cat.name+" - ":"")+groupName,item:name+cutTxt+duplexTxt+colabTxt,qtd:qty,unit:fmt(unitVal),sub:sub});
        }
      });
    }
  });

  const total=document.getElementById("grandTotal").textContent;
  const dataHora=new Date().toLocaleString("pt-BR");
  const cliente=(document.getElementById("clienteNome")?.value||"").trim();
  const designer=getDesignerName();

  let rowsHtml="";
  if(linhas.length===0){
    rowsHtml=`<tr><td colspan="5" style="text-align:center;padding:20px;color:#888">Nenhum item selecionado</td></tr>`;
  } else {
    linhas.forEach(l=>{
      rowsHtml+=`<tr class="border-b border-gray-100"><td class="py-2 px-2 text-left text-xs text-gray-600">${escapeHtml(l.categoria)}</td><td class="py-2 px-2 text-left text-sm font-medium">${escapeHtml(l.item)}</td><td class="py-2 px-2 text-center text-sm">${l.qtd}</td><td class="py-2 px-2 text-right text-sm text-gray-600">${l.unit}</td><td class="py-2 px-2 text-right text-sm font-semibold">${l.sub}</td></tr>`;
    });
  }

  document.getElementById("reciboBody").innerHTML=`
    <div class="recibo-header bg-white text-gray-900 px-6 py-5 flex items-center gap-3 border-b border-gray-200">
      <img src="https://raw.githubusercontent.com/bnoru/calculadora-xerox/refs/heads/main/path4.png" alt="Logo Xerox do Victor" class="h-9">
      <h2 class="text-lg font-bold">Xerox do Victor</h2>
    </div>
    <div class="px-6 pt-4 flex justify-between text-xs text-gray-500">
      <span>Recibo</span><span>${dataHora}</span>
    </div>
    ${cliente?`<div class="px-6 pt-1 text-sm font-semibold text-gray-800">Cliente: ${escapeHtml(cliente)}</div>`:""}
    ${designer?`<div class="px-6 pb-1 text-xs text-gray-500">Atendido por: ${escapeHtml(designer)}</div>`:""}
    <div class="px-6 pb-2">
      <table class="w-full mt-2">
        <thead><tr class="text-xs uppercase text-gray-500 bg-gray-50">
          <th class="text-left py-2 px-2">Categoria</th><th class="text-left py-2 px-2">Item</th><th class="text-center py-2 px-2">Qtde.</th><th class="text-right py-2 px-2">Preço Unit.</th><th class="text-right py-2 px-2">Subtotal</th>
        </tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
    <div class="recibo-total mx-6 mb-4 mt-2 bg-gray-50 border border-gray-200 rounded-lg px-5 py-4 flex justify-between items-center">
      <span class="font-semibold text-gray-900">Total a pagar</span><span class="text-xl font-bold text-gray-900">${total}</span>
    </div>
    <div class="px-6 pb-6 text-xs text-gray-400 text-center">Apresente este recibo no caixa para pagamento.</div>
  `;

  document.getElementById("reciboModal").classList.remove("hidden");
}

function fecharRecibo(){
  document.getElementById("reciboModal").classList.add("hidden");
}

// ========== ORDEM DE SERVIÇO ==========
function abrirOS(){
  document.getElementById("osDataPedido").textContent=new Date().toLocaleString("pt-BR");

  // Campos automáticos (cliente/designer já preenchidos na calculadora)
  document.getElementById("osCliente").value=document.getElementById("clienteNome")?.value||"";
  document.getElementById("osDesigner").value=getDesignerName();

  // Campos a serem preenchidos manualmente pelo designer: sempre começam em branco
  document.getElementById("osNota").value="";
  document.getElementById("osEntrega").value="";

  // Monta os itens: um bloco por linha de adesivo já preenchida na calculadora
  // (largura/altura/quantidade/acabamento), ou um bloco em branco se não houver nenhuma.
  const container=document.getElementById("osItemsContainer");
  container.innerHTML="";

  const itensImportados=[];
  const catAdesivos=document.getElementById("cat_3");
  if(catAdesivos){
    const temValor=row=>(parseFloat(row.querySelector("[data-qty]")?.value)||0)>0;
    const simplesRows=[...catAdesivos.querySelectorAll('[data-group="Leitoso corte simples"] tr[data-rules]')].filter(temValor);
    const contornoRows=[...catAdesivos.querySelectorAll('[data-group="Leitoso corte contorno"] tr[data-rules]')].filter(temValor);

    simplesRows.forEach(row=>{
      itensImportados.push({
        largura:row.querySelector("[data-w]")?.value||"",
        altura:row.querySelector("[data-h]")?.value||"",
        qtd:row.querySelector("[data-qty]")?.value||"",
        acabamento:"Corte simples"
      });
    });
    contornoRows.forEach(row=>{
      itensImportados.push({
        largura:row.querySelector("[data-w]")?.value||"",
        altura:row.querySelector("[data-h]")?.value||"",
        qtd:row.querySelector("[data-qty]")?.value||"",
        acabamento:"Corte contorno"
      });
    });
  }

  if(itensImportados.length===0){
    container.appendChild(criarItemOS());
  } else {
    itensImportados.forEach(dados=>container.appendChild(criarItemOS(dados)));
  }
  atualizarBotoesRemoverItemOS();

  document.getElementById("osModal").classList.remove("hidden");
}

function fecharOS(){
  document.getElementById("osModal").classList.add("hidden");
}

const OS_MATERIAIS=["Adesivo leitoso","Adesivo leitoso blackout","Adesivo fosco","Adesivo transparente normal","Adesivo transparente espelhado","Lona comum","Lona fosca","Tecido","Tecido canvas","Adesivo refletivo","Adesivo jateado","Papel comum","Recorte vinil","Recorte emborrachado"];
const OS_ACABAMENTOS=["Corda em cima","Corda nas 4 pontas","Laminação transparente","Laminação leitosa","Material do cliente","Corte contorno","Ímã","PVC","Ilhós","Corte simples","Sem acabamento"];
const OS_MATERIAIS_COM_COR=["Recorte vinil","Recorte emborrachado"];

function criarItemOS(dados={}){
  const div=document.createElement("div");
  div.className="os-item border border-gray-200 rounded-lg p-3 flex flex-col gap-2";
  div.dataset.osItem="1";

  const opcoesMaterial=`<option value="">Selecione...</option>`+OS_MATERIAIS.map(m=>`<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join("");
  const opcoesAcabamento=`<option value="">Selecione...</option>`+OS_ACABAMENTOS.map(a=>`<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`).join("");

  div.innerHTML=`
    <div class="flex items-center justify-between">
      <span class="text-xs font-semibold text-gray-500 uppercase">Item</span>
      <button type="button" onclick="removerItemOS(this)" class="os-item-remove no-print" style="background:none;border:none;color:#9ca3af;cursor:pointer;font-size:14px" title="Remover item">✕</button>
    </div>
    <div class="flex items-center gap-3">
      <label class="text-sm font-medium text-gray-700 whitespace-nowrap os-label">Arquivo:</label>
      <input type="text" data-os-arquivo class="input input-bordered w-full bg-white px-3 py-2" placeholder="Nome do arquivo da imagem">
    </div>
    <div class="os-imagem-row flex items-start gap-3">
      <label class="text-sm font-medium text-gray-700 whitespace-nowrap os-label" style="padding-top:.5rem">Imagem:</label>
      <div class="w-full">
        <input type="file" accept="image/*" data-os-imagem-input onchange="handleImagemUpload(this)" class="no-print text-xs">
        <div data-os-imagem-preview-wrapper style="display:none;margin-top:6px">
          <img data-os-imagem-preview style="max-width:440px;max-height:320px;border:1px solid #d1d5db;border-radius:4px;display:block;object-fit:contain">
          <button type="button" onclick="removerImagemOS(this)" class="no-print" style="margin-top:4px;background:none;border:none;color:#9ca3af;cursor:pointer;font-size:12px;text-decoration:underline">Remover imagem</button>
        </div>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <label class="text-sm font-medium text-gray-700 whitespace-nowrap os-label">Largura (m):</label>
      <input type="number" step="0.01" min="0" data-os-largura class="input input-bordered w-full bg-white px-3 py-2">
      <label class="text-sm font-medium text-gray-700 whitespace-nowrap os-label">Altura (m):</label>
      <input type="number" step="0.01" min="0" data-os-altura class="input input-bordered w-full bg-white px-3 py-2">
    </div>
    <div class="flex items-center gap-3">
      <label class="text-sm font-medium text-gray-700 whitespace-nowrap os-label">Quantidade:</label>
      <input type="number" step="1" min="0" data-os-qtd class="input input-bordered w-full bg-white px-3 py-2">
    </div>
    <div class="flex items-center gap-3">
      <label class="text-sm font-medium text-gray-700 whitespace-nowrap os-label">Material:</label>
      <select data-os-material class="input input-bordered w-full bg-white px-3 py-2" onchange="atualizarCampoCor(this)">${opcoesMaterial}</select>
    </div>
    <div class="flex items-center gap-3 os-cor-wrapper" style="display:none">
      <label class="text-sm font-medium text-gray-700 whitespace-nowrap os-label">Cor:</label>
      <input type="text" data-os-cor class="input input-bordered w-full bg-white px-3 py-2" placeholder="Cor do vinil/emborrachado">
    </div>
    <div class="flex items-center gap-3">
      <label class="text-sm font-medium text-gray-700 whitespace-nowrap os-label">Acabamento:</label>
      <select data-os-acabamento class="input input-bordered w-full bg-white px-3 py-2">${opcoesAcabamento}</select>
    </div>
    <div class="os-obs-row flex items-start gap-3">
      <label class="text-sm font-medium text-gray-700 whitespace-nowrap os-label" style="padding-top:.5rem">Observações:</label>
      <textarea data-os-obs rows="2" class="input input-bordered w-full bg-white px-3 py-2" style="height:auto;resize:vertical" placeholder="Observações deste item"></textarea>
    </div>
  `;

  if(dados.arquivo) div.querySelector("[data-os-arquivo]").value=dados.arquivo;
  if(dados.largura) div.querySelector("[data-os-largura]").value=dados.largura;
  if(dados.altura) div.querySelector("[data-os-altura]").value=dados.altura;
  if(dados.qtd) div.querySelector("[data-os-qtd]").value=dados.qtd;
  if(dados.material) div.querySelector("[data-os-material]").value=dados.material;
  if(dados.acabamento) div.querySelector("[data-os-acabamento]").value=dados.acabamento;
  if(dados.obs) div.querySelector("[data-os-obs]").value=dados.obs;
  if(dados.cor) div.querySelector("[data-os-cor]").value=dados.cor;
  atualizarCampoCor(div.querySelector("[data-os-material]"));

  return div;
}

function adicionarItemOS(){
  const container=document.getElementById("osItemsContainer");
  container.appendChild(criarItemOS());
  atualizarBotoesRemoverItemOS();
}

function removerItemOS(btn){
  btn.closest("[data-os-item]").remove();
  atualizarBotoesRemoverItemOS();
}

function atualizarBotoesRemoverItemOS(){
  const items=document.querySelectorAll('#osItemsContainer [data-os-item]');
  items.forEach(item=>{
    const btn=item.querySelector(".os-item-remove");
    if(btn) btn.style.display=items.length>1?"inline-block":"none";
  });
}

function atualizarCampoCor(select){
  const item=select.closest("[data-os-item]");
  const wrapper=item.querySelector(".os-cor-wrapper");
  if(OS_MATERIAIS_COM_COR.includes(select.value)){
    wrapper.style.display="flex";
  } else {
    wrapper.style.display="none";
    const corInput=item.querySelector("[data-os-cor]"); if(corInput) corInput.value="";
  }
}

// Lê a imagem escolhida e mostra uma prévia dentro do item da OS, para o
// setor conseguir ver o conteúdo a ser impresso.
function handleImagemUpload(input){
  const item=input.closest("[data-os-item]");
  const wrapper=item.querySelector("[data-os-imagem-preview-wrapper]");
  const img=item.querySelector("[data-os-imagem-preview]");
  const file=input.files&&input.files[0];
  if(!file){
    wrapper.style.display="none";
    img.src="";
    return;
  }
  const reader=new FileReader();
  reader.onload=function(e){
    img.src=e.target.result;
    wrapper.style.display="block";
  };
  reader.readAsDataURL(file);
}

function removerImagemOS(btn){
  const item=btn.closest("[data-os-item]");
  const wrapper=item.querySelector("[data-os-imagem-preview-wrapper]");
  const img=item.querySelector("[data-os-imagem-preview]");
  const fileInput=item.querySelector("[data-os-imagem-input]");
  img.src="";
  wrapper.style.display="none";
  if(fileInput) fileInput.value="";
}

// Esconde a linha de Observações e a de Imagem de cada item da OS na
// impressão quando estiverem vazias (evita imprimir placeholder/controles
// de upload inúteis no papel).
window.onbeforeprint=function(){
  document.querySelectorAll(".os-obs-row").forEach(row=>{
    const ta=row.querySelector("[data-os-obs]");
    if(ta&&ta.value.trim()===""){
      row.dataset.hiddenForPrint="1";
      row.style.display="none";
    }
  });
  document.querySelectorAll(".os-imagem-row").forEach(row=>{
    const wrapper=row.querySelector("[data-os-imagem-preview-wrapper]");
    const temImagem=wrapper&&wrapper.style.display!=="none";
    if(!temImagem){
      row.dataset.hiddenForPrint="1";
      row.style.display="none";
    }
  });
};
window.onafterprint=function(){
  document.querySelectorAll(".os-obs-row, .os-imagem-row").forEach(row=>{
    if(row.dataset.hiddenForPrint==="1"){
      row.style.display="";
      delete row.dataset.hiddenForPrint;
    }
  });
};
</script>
