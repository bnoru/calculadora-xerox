// ===== HELPERS =====
function findTieredRate(qty, tiers) {
  for (const t of tiers) {
    if (qty >= t.min_qty) return t.rate;
  }
  return tiers[tiers.length - 1]?.rate || 0;
}

function findAdhesiveRate(m2, tiers) {
  for (const t of tiers) {
    if (m2 >= t.min_m2) return t.rate;
  }
  return tiers[tiers.length - 1]?.rate || 0;
}

function formatCurrency(value) {
  return new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }).format(value);
}

function parseCurrency(value) {
  if (!value) return 0;
  const cleaned = value.replace(/[R$\s]/g, "").replace(/\./g, "").replace(",", ".");
  return parseFloat(cleaned) || 0;
}

function calculateAll() {
  let total = 0;
  document.querySelectorAll("[data-subtotal]").forEach(el => {
    total += parseCurrency(el.textContent);
  });
  document.getElementById("grandTotal").textContent = formatCurrency(total);
  document.getElementById("grandTotal2").textContent = formatCurrency(total);

  // Group totals
  document.querySelectorAll("[data-group]").forEach(group => {
    let gt = 0;
    group.querySelectorAll("[data-subtotal]").forEach(el => { gt += parseCurrency(el.textContent); });
    const el = group.querySelector("[data-group-total]");
    if (el) el.textContent = formatCurrency(gt);
  });

  // Category totals
  document.querySelectorAll("[data-category]").forEach(cat => {
    let ct = 0;
    cat.querySelectorAll("[data-subtotal]").forEach(el => { ct += parseCurrency(el.textContent); });
    const el = cat.querySelector("[data-category-total]");
    if (el) el.textContent = formatCurrency(ct);
  });
}

function calculateRow(row) {
  const rules = JSON.parse(row.dataset.pricingRules);
  const qty = parseFloat(row.querySelector("[data-qty]")?.value) || 0;
  let subtotal = 0;

  if (rules.type === "flat") {
    subtotal = qty * rules.rate;
  } else if (rules.type === "tiered") {
    const rate = findTieredRate(qty, rules.tiers);
    subtotal = qty * rate;
  } else if (rules.type === "adhesive") {
    const width = parseFloat(row.querySelector("[data-width]")?.value) || 0;
    const height = parseFloat(row.querySelector("[data-height]")?.value) || 0;
    const bleed = rules.bleed || 0;

    if (width > 0 && height > 0) {
      const m2 = (width + bleed) * (height + bleed) * qty;
      const rate = findAdhesiveRate(m2, rules.tiers);
      const raw = m2 * rate;
      subtotal = Math.max(raw, rules.min_charge || 0);
      const m2El = row.querySelector("[data-m2]");
      if (m2El) m2El.textContent = m2.toFixed(3);
    }
  }

  // Cutting cost
  const cut = row.querySelector("[data-cut]");
  if (cut && cut.checked && qty > 0) {
    subtotal += qty * 1.00;
  }

  const st = row.querySelector("[data-subtotal]");
  if (st) st.textContent = formatCurrency(subtotal);
  calculateAll();
}

// ===== RENDER =====
const icons = { "Color": "fa-palette", "P/B": "fa-file-lines", "Adesivos": "fa-tag" };

// Tabs
const tabsContainer = document.getElementById("categoryTabs");
categories.forEach((cat, idx) => {
  const btn = document.createElement("button");
  btn.className = `tab tab-lg gap-2 flex-1 transition-all duration-200 ${idx === 0 ? 'tab-active bg-gray-900 text-white hover:bg-gray-800' : 'hover:bg-gray-100'}`;
  btn.dataset.categoryId = cat.id;
  btn.onclick = function(e) {
    document.querySelectorAll("#categoryTabs .tab").forEach(t => {
      t.classList.remove("tab-active", "bg-gray-900", "text-white", "hover:bg-gray-800");
      t.classList.add("hover:bg-gray-100");
    });
    this.classList.add("tab-active", "bg-gray-900", "text-white", "hover:bg-gray-800");
    this.classList.remove("hover:bg-gray-100");
    document.querySelectorAll("[data-category]").forEach(el => el.classList.add("hidden"));
    const target = document.getElementById("category_" + this.dataset.categoryId);
    if (target) target.classList.remove("hidden");
  };
  btn.innerHTML = `<i class="fas ${icons[cat.name] || 'fa-calculator'}"></i><span class="hidden sm:inline"> ${cat.name}</span>`;
  tabsContainer.appendChild(btn);
});

// Contents
const contentsContainer = document.getElementById("categoryContents");
categories.forEach((cat, idx) => {
  const catDiv = document.createElement("div");
  catDiv.id = "category_" + cat.id;
  catDiv.dataset.category = cat.id;
  catDiv.className = (idx === 0 ? "" : "hidden ") + "space-y-6";

  cat.groups.forEach(group => {
    const isCommonPaper = group.name.includes("Papel comum");
    const isAdhesiveGroup = group.items.some(i => i.pricing_rules?.type === "adhesive");

    const groupDiv = document.createElement("div");
    groupDiv.className = "bg-white rounded-2xl shadow-sm border border-base-200 overflow-hidden transition-all duration-200 hover:shadow-md";
    groupDiv.dataset.group = group.name.toLowerCase().replace(/\s+/g, '-');

    // Group header
    groupDiv.innerHTML = `
      <div class="px-6 py-4 bg-gradient-to-r from-base-100 to-base-50 border-b border-base-200 flex items-center gap-3">
        <div class="w-1 h-8 rounded-full bg-gradient-to-b from-gray-500 to-gray-700"></div>
        <h3 class="text-lg font-semibold text-base-content">${group.name}</h3>
        <span class="ml-auto text-sm font-medium text-base-content/60">
          Subtotal: <span class="font-mono font-bold text-gray-900" data-group-total>R$ 0,00</span>
        </span>
      </div>
      <div class="overflow-x-auto">
        <table class="table table-zebra table-pin-rows">
          <thead>
            <tr class="text-sm uppercase tracking-wider text-base-content/50">
              <th class="py-4 pl-6">Item</th>
              <th class="py-4 text-right">Preço Unit.</th>
              <th class="py-4 text-right">Qtde.</th>
              ${!isCommonPaper ? '<th class="py-4 text-center">Corte?</th>' : ''}
              ${isAdhesiveGroup ? '<th class="py-4 text-right">Largura (m)</th><th class="py-4 text-right">Altura (m)</th><th class="py-4 text-right">m²</th>' : ''}
              <th class="py-4 pr-6 text-right">Subtotal</th>
            </tr>
          </thead>
          <tbody>
            ${group.items.map(item => {
              const rules = item.pricing_rules;
              const isAdhesive = rules?.type === "adhesive";
              let priceDisplay = "";
              if (rules.type === "flat") {
                priceDisplay = `<span class="font-mono text-sm">R$ ${rules.rate.toFixed(2)}</span>`;
              } else if (rules.type === "tiered") {
                priceDisplay = `<span class="text-xs text-base-content/40">por quantidade</span><span class="font-mono text-xs text-gray-600">${rules.tiers.map((t,i) => "R$ " + t.rate.toFixed(2)).join(" | ")}</span>`;
              } else if (rules.type === "adhesive") {
                priceDisplay = `<span class="text-xs text-base-content/40">por m²</span><span class="font-mono text-xs text-gray-600">${rules.tiers.map(t => "R$ " + t.rate.toFixed(2) + "/m²").join(" | ")}</span>`;
              }
              return `<tr data-pricing-rules='${JSON.stringify(rules)}' class="transition-all duration-150 hover:bg-base-200/50">
                <td class="pl-6 py-4"><span class="font-medium text-base-content">${item.name}</span></td>
                <td class="text-right py-4"><div class="flex flex-col items-end">${priceDisplay}</div></td>
                <td class="text-right py-4"><input type="number" min="0" step="1" value="" class="input input-bordered input-sm w-20 text-right font-mono focus:input-primary" data-qty oninput="calculateRow(this.closest('[data-pricing-rules]'))"></td>
                ${!isCommonPaper ? `<td class="text-center py-4"><input type="checkbox" class="toggle toggle-xs border-gray-300 bg-gray-200" style="--tglbg: #111827; border-color: #d1d5db; background-color: #e5e7eb;" data-cut onchange="calculateRow(this.closest('[data-pricing-rules]'))"></td>` : ''}
                ${isAdhesive ? `
                  <td class="text-right py-4"><input type="number" min="0" step="0.01" value="" class="input input-bordered input-sm w-24 text-right font-mono focus:input-primary" data-width oninput="calculateRow(this.closest('[data-pricing-rules]'))" placeholder="0,00"></td>
                  <td class="text-right py-4"><input type="number" min="0" step="0.01" value="" class="input input-bordered input-sm w-24 text-right font-mono focus:input-primary" data-height oninput="calculateRow(this.closest('[data-pricing-rules]'))" placeholder="0,00"></td>
                  <td class="text-right py-4"><span class="font-mono text-sm text-base-content/60" data-m2>0,000</span></td>
                ` : ''}
                <td class="pr-6 py-4 text-right"><span class="font-mono font-semibold text-gray-900 text-lg" data-subtotal>R$ 0,00</span></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    `;
    catDiv.appendChild(groupDiv);
  });

  // Category total
  const catTotal = document.createElement("div");
  catTotal.className = "bg-white rounded-2xl shadow-sm border border-base-200 p-6 flex justify-end items-center gap-6";
  catTotal.innerHTML = `<span class="text-xl font-medium text-base-content/70">Total ${cat.name}</span><span class="text-2xl font-bold text-gray-900" data-category-total>R$ 0,00</span>`;
  catDiv.appendChild(catTotal);
  contentsContainer.appendChild(catDiv);
});
</script>
</body>
</html>
