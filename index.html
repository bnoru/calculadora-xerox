<!DOCTYPE html>

    .tab { transition: all 0.2s ease; }

    input[type="number"]::-webkit-outer-spin-button { opacity: 0.4; }
    .input-error { border-color: #ef4444 !important; }
  </style>
</head>
<body>

<!-- ===== HTML ===== -->
<div data-controller="calculator" class="min-h-screen bg-gradient-to-br from-base-200 to-base-300">
  <!-- Hero Header -->
  <div class="bg-gray-900 text-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12">
      <div class="flex items-center gap-5">
        <div class="w-12 h-12 sm:w-14 sm:h-14 bg-white/10 rounded-xl flex items-center justify-center">
          <i class="fas fa-print text-2xl text-white"></i>
        </div>
        <div>
          <h1 class="text-3xl sm:text-4xl font-bold tracking-tight">Calculadora Xerox do Victor</h1>
        </div>
      </div>
    </div>
  </div>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 -mt-6 pb-36">
    <!-- Grand Total Card (top summary) -->
    <div class="bg-white rounded-2xl shadow-xl border border-base-200 p-6 mb-8 flex items-center justify-between transition-all duration-300">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-gray-100 rounded-xl">
          <i class="fas fa-coins text-2xl text-gray-600"></i>

        <div>
          <span class="text-lg font-medium text-base-content/70">Total Geral</span>
          <p class="text-sm text-base-content/40">Todos os serviços</p>
        </div>
      </div>
      <div class="text-3xl sm:text-4xl font-bold text-gray-900 transition-all duration-300" data-calculator-target="grandTotal">
        R$ 0,00
      </div>
    </div>

    <!-- Category Tabs -->
    <div class="mb-6" role="tablist">
      <div class="tabs tabs-boxed bg-white shadow-sm border border-base-200 p-1 gap-1" id="category-tabs">

    <!-- Category Contents -->
    <div id="category-contents">
      <!-- Injected by JS -->
    </div>

    <!-- Custom Services Section -->
    <div class="bg-white rounded-2xl shadow-sm border border-base-200 overflow-hidden mt-6">
      <div class="px-6 py-4 bg-gradient-to-r from-base-100 to-base-50 border-b border-base-200 flex items-center gap-3">
        <i class="fas fa-plus-circle text-lg text-gray-500"></i>
        <h3 class="text-lg font-semibold text-base-content">Outros Serviços</h3>

<!-- ===== STIMULUS CONTROLLER ===== -->
<script>
(function() {
  const application = Stimulus.Application.start()

  application.register("calculator", class extends Stimulus.Controller {
    static targets = ["qty", "subtotal", "grandTotal", "tab", "categoryContent"]

    connect() {
      this.renderTabs()
      this.renderCategories()
      this.calculateAll()
    }

    // ── Render HTML from data ──

    renderTabs() {
      const container = document.getElementById("category-tabs")
      container.innerHTML = CATEGORIES.map((cat, i) => `
        <button class="tab tab-lg gap-2 flex-1 transition-all duration-200 ${i === 0 ? 'tab-active bg-gray-900 text-white hover:bg-gray-800' : 'hover:bg-gray-100'}"
                data-calculator-target="tab"
                data-action="click->calculator#switchCategory"
                data-category-id="${cat.id}">
          <i class="fas ${cat.icon}"></i>
          <span class="hidden sm:inline">${cat.name}</span>
        </button>
      `).join("")
    }

    renderCategories() {
      const container = document.getElementById("category-contents")
      container.innerHTML = CATEGORIES.map((cat, i) => {
        // Group items
        const groups = {}
        cat.items.forEach(item => {
          if (!groups[item.group_name]) groups[item.group_name] = []
          groups[item.group_name].push(item)
        })

        const groupHtml = Object.entries(groups).map(([groupName, items]) => {
          const isCommonPaper = groupName.includes("Papel comum")
          const isAdhesive = groupName.includes("Leitoso")

          const rowsHtml = items.map(item => {
            const rules = item.pricing_rules
            const isItemAdhesive = rules.type === "adhesive"

            let rateDisplay = ""
            if (rules.type === "tiered") {
              rateDisplay = rules.tiers.map((t, idx) => `R$ ${t.rate.toFixed(2)}${idx < rules.tiers.length - 1 ? " | " : ""}`).join("")
            } else if (rules.type === "flat") {
              rateDisplay = `R$ ${rules.rate.toFixed(2)}`
            } else if (rules.type === "adhesive") {
              rateDisplay = rules.tiers.map(t => `R$ ${t.rate.toFixed(2)}/m²`).join(" | ")
            }

            let typeLabel = ""
            if (rules.type === "tiered") typeLabel = '<span class="text-xs text-base-content/40">por quantidade</span>'
            else if (rules.type === "adhesive") typeLabel = '<span class="text-xs text-base-content/40">por m²</span>'

            return `
              <tr data-calculator-row
                  data-pricing-rules='${JSON.stringify(rules)}'
                  class="transition-all duration-150 hover:bg-base-200/50">
                <td class="pl-6 py-4">
                  <div class="flex items-center gap-3">
                    <span class="font-medium text-base-content">${item.name}</span>
                  </div>
                </td>
                <td class="text-right py-4">
                  <div class="flex flex-col items-end">
                    ${typeLabel}
                    <span class="font-mono text-xs text-gray-600" data-calculator-target="rateDisplay">${rateDisplay}</span>
                  </div>
                </td>
                <td class="text-right py-4">
                  <input type="number" min="0" step="1" value=""
                    class="input input-bordered input-sm w-20 text-right font-mono transition-all duration-150 focus:input-primary"
                    data-calculator-target="qty"
                    data-action="input->calculator#calculate" />
                </td>
                ${!isCommonPaper ? `
                <td class="text-center py-4">
                  <input type="checkbox"
                    class="toggle toggle-xs border-gray-300 bg-gray-200 [&:checked]:bg-gray-900 [&:checked]:border-gray-900"
                    data-calculator-target="cut"
                    data-action="change->calculator#calculate" />
                </td>` : ""}
                ${isItemAdhesive ? `
                <td class="text-right py-4">
                  <input type="number" min="0" step="0.01" value=""
                    class="input input-bordered input-sm w-24 text-right font-mono transition-all duration-150 focus:input-primary"
                    data-calculator-target="width" data-action="input->calculator#calculate" placeholder="0,00" />
                </td>
                <td class="text-right py-4">
                  <input type="number" min="0" step="0.01" value=""
                    class="input input-bordered input-sm w-24 text-right font-mono transition-all duration-150 focus:input-primary"
                    data-calculator-target="height" data-action="input->calculator#calculate" placeholder="0,00" />
                </td>
                <td class="text-right py-4">
                  <span class="font-mono text-sm text-base-content/60" data-calculator-target="m2">0,000</span>
                </td>` : ""}
                <td class="pr-6 py-4 text-right">
                  <span class="font-mono font-semibold text-gray-900 text-lg" data-calculator-target="subtotal">R$ 0,00</span>
                </td>
              </tr>
            `
          }).join("")

          return `
            <div class="bg-white rounded-2xl shadow-sm border border-base-200 overflow-hidden transition-all duration-200 hover:shadow-md"
                 data-calculator-group="${groupName.replace(/\s+/g, '-').toLowerCase()}">
              <div class="px-6 py-4 bg-gradient-to-r from-base-100 to-base-50 border-b border-base-200 flex items-center gap-3">
                <div class="w-1 h-8 rounded-full bg-gradient-to-b from-gray-500 to-gray-700"></div>
                <h3 class="text-lg font-semibold text-base-content">${groupName}</h3>
                <span class="ml-auto text-sm font-medium text-base-content/60">
                  Subtotal: <span class="font-mono font-bold text-gray-900" data-calculator-target="groupTotal">R$ 0,00</span>
                </span>
              </div>
              <div class="overflow-x-auto">
                <table class="table table-zebra table-pin-rows">
                  <thead>
                    <tr class="text-sm uppercase tracking-wider text-base-content/50">
                      <th class="py-4 pl-6">Item</th>
                      <th class="py-4 text-right">Preço Unit.</th>
                      <th class="py-4 text-right">Qtde.</th>
                      ${!isCommonPaper ? '<th class="py-4 text-center">Corte?</th>' : ''}
                      ${isAdhesive ? '<th class="py-4 text-right">Largura (m)</th><th class="py-4 text-right">Altura (m)</th><th class="py-4 text-right">m²</th>' : ''}
                      <th class="py-4 pr-6 text-right">Subtotal</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${rowsHtml}
                  </tbody>
                </table>
              </div>
            </div>
          `
        }).join("")

        return `
          <div id="category_${cat.id}"
               data-calculator-target="categoryContent"
               data-calculator-category="${cat.id}"
               class="${i === 0 ? '' : 'hidden'} space-y-6">
            ${groupHtml}
            <div class="bg-white rounded-2xl shadow-sm border border-base-200 p-6 flex justify-end items-center gap-6">
              <span class="text-xl font-medium text-base-content/70">Total ${cat.name}</span>
              <span class="text-2xl font-bold text-gray-900" data-calculator-target="categoryTotal">R$ 0,00</span>
            </div>
          </div>
        `
      }).join("")
    }

    // ── Pricing calculation ──

    calculate(event) {
      const row = event.target.closest("[data-calculator-row]")
      if (!row) return

      const rules = JSON.parse(row.dataset.pricingRules)
      const qty = parseFloat(row.querySelector("[data-calculator-target='qty']")?.value) || 0

      let subtotal = 0
      let displayPrice = ""

      if (rules.type === "flat") {
        subtotal = qty * rules.rate
        displayPrice = `R$ ${rules.rate.toFixed(2)}`
      } else if (rules.type === "tiered") {
        const rate = this.findTieredRate(qty, rules.tiers)
        subtotal = qty * rate
        displayPrice = `R$ ${rate.toFixed(2)}`
      } else if (rules.type === "adhesive") {
        const width = parseFloat(row.querySelector("[data-calculator-target='width']")?.value) || 0
        const height = parseFloat(row.querySelector("[data-calculator-target='height']")?.value) || 0
        const bleed = rules.bleed || 0

        if (width > 0 && height > 0) {
          const effectiveWidth = width + bleed
          const effectiveHeight = height + bleed
          const m2 = effectiveWidth * effectiveHeight * qty
          const rate = this.findAdhesiveRate(m2, rules.tiers)
          const rawTotal = m2 * rate
          subtotal = Math.max(rawTotal, rules.min_charge || 0)
          const m2Field = row.querySelector("[data-calculator-target='m2']")
          if (m2Field) m2Field.textContent = m2.toFixed(3)
        }
        displayPrice = rules.tiers.map(t => `R$ ${t.rate.toFixed(2)}/m²`).join(" | ")
      }

      // Add R$ 1,00 per unit for cutting service
      const cutCheckbox = row.querySelector("[data-calculator-target='cut']")
      if (cutCheckbox && cutCheckbox.checked && qty > 0) {
        subtotal += qty * 1.00
      }

      const subtotalTarget = row.querySelector("[data-calculator-target='subtotal']")
      if (subtotalTarget) subtotalTarget.textContent = this.formatCurrency(subtotal)

      const rateDisplay = row.querySelector("[data-calculator-target='rateDisplay']")
      if (rateDisplay) rateDisplay.textContent = displayPrice

      this.calculateAll()
    }

    findTieredRate(qty, tiers) {
      for (const tier of tiers) {
        if (qty >= tier.min_qty) return tier.rate
      }
      return tiers[tiers.length - 1]?.rate || 0
    }

    findAdhesiveRate(m2, tiers) {
      for (const tier of tiers) {
        if (m2 >= tier.min_m2) return tier.rate
      }
      return tiers[tiers.length - 1]?.rate || 0
    }

    calculateAll() {
      let total = 0
      this.subtotalTargets.forEach(el => { total += this.parseCurrency(el.textContent) })

      // Add custom services
      document.querySelectorAll("#custom-services-list .custom-service-price").forEach(el => {
        total += this.parseCurrency(el.textContent)
      })

      if (this.hasGrandTotalTarget) {
        this.grandTotalTargets.forEach(target => {
          target.textContent = this.formatCurrency(total)
        })
      }

      // Per-group subtotals
      document.querySelectorAll("[data-calculator-group]").forEach(group => {
        let groupTotal = 0
        group.querySelectorAll("[data-calculator-target='subtotal']").forEach(el => {
          groupTotal += this.parseCurrency(el.textContent)
        })
        const groupTotalEl = group.querySelector("[data-calculator-target='groupTotal']")
        if (groupTotalEl) groupTotalEl.textContent = this.formatCurrency(groupTotal)
      })

      // Per-category subtotals
      document.querySelectorAll("[data-calculator-category]").forEach(cat => {
        let catTotal = 0
        cat.querySelectorAll("[data-calculator-target='subtotal']").forEach(el => {
          catTotal += this.parseCurrency(el.textContent)
        })
        const catTotalEl = cat.querySelector("[data-calculator-target='categoryTotal']")
        if (catTotalEl) catTotalEl.textContent = this.formatCurrency(catTotal)
      })

      // Custom services total
      let customTotal = 0
      document.querySelectorAll("#custom-services-list .custom-service-price").forEach(el => {
        customTotal += this.parseCurrency(el.textContent)
      })
      const customTotalEl = document.querySelector("[data-calculator-target='customServicesTotal']")
      if (customTotalEl) customTotalEl.textContent = this.formatCurrency(customTotal)
    }

    formatCurrency(value) {
      return new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }).format(value)
    }

    parseCurrency(value) {
      if (!value) return 0
      const cleaned = value.replace(/[R$\s]/g, "").replace(/\./g, "").replace(",", ".")
      return parseFloat(cleaned) || 0
    }

    // ── Custom Services ──

    addCustomService(event) {
      event.preventDefault()
      const nameInput = document.getElementById("custom-service-name")
      const priceInput = document.getElementById("custom-service-price")
      const name = nameInput?.value?.trim()
      const price = parseFloat(priceInput?.value) || 0

      if (!name) {
        nameInput?.focus(); nameInput?.classList.add("input-error")
        setTimeout(() => nameInput?.classList.remove("input-error"), 1000)
        return
      }
      if (price <= 0) {
        priceInput?.focus(); priceInput?.classList.add("input-error")
        setTimeout(() => priceInput?.classList.remove("input-error"), 1000)
        return
      }

      const list = document.getElementById("custom-services-list")
      if (!list) return

      const rowId = `custom-service-${Date.now()}`
      const row = document.createElement("div")
      row.id = rowId
      row.className = "flex items-center justify-between p-3 bg-white rounded-xl border border-base-200 transition-all duration-200 hover:shadow-sm"
      row.innerHTML = `
        <div class="flex items-center gap-3 min-w-0 flex-1">
          <i class="fas fa-cog text-gray-400"></i>
          <span class="font-medium text-base-content truncate">${this.escapeHtml(name)}</span>
        </div>
        <div class="flex items-center gap-4">
          <span class="font-mono font-semibold text-lg text-gray-900 custom-service-price">${this.formatCurrency(price)}</span>
          <button class="btn btn-ghost btn-xs btn-square text-gray-400 hover:text-red-500 transition-colors"
                  data-action="click->calculator#removeCustomService"
                  data-service-row="${rowId}">
            <i class="fas fa-times"></i>
          </button>
        </div>
      `
      list.appendChild(row)
      nameInput.value = ""
      priceInput.value = ""
      this.calculateAll()
      nameInput.focus()
    }

    removeCustomService(event) {
      const button = event.currentTarget
      const rowId = button.dataset.serviceRow
      const row = document.getElementById(rowId)
      if (row) {
        row.style.transition = "all 0.2s ease-out"
        row.style.opacity = "0"
        row.style.transform = "translateX(20px)"
        setTimeout(() => { row.remove(); this.calculateAll() }, 200)
      }
    }

    escapeHtml(str) {
      const div = document.createElement("div")
      div.textContent = str
      return div.innerHTML
    }

    // ── Print Receipt ──

    printReceipt() {
      const receiptData = this.collectReceiptData()
      const printWindow = window.open("", "_blank", "width=800,height=600")

      let html = `<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Recibo - Calculadora Xerox do Victor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<style>
  @page { margin: 15mm; }
  * { box-sizing: border-box; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #1f2937; background: #fff; padding: 0; margin: 0; }
  .receipt { max-width: 700px; margin: 0 auto; padding: 32px 24px; }
  .header { text-align: center; border-bottom: 2px solid #1f2937; padding-bottom: 20px; margin-bottom: 24px; }
  .header h1 { font-size: 24px; font-weight: 800; margin: 0 0 4px 0; text-transform: uppercase; letter-spacing: 0.05em; }
  .header p { color: #6b7280; font-size: 14px; margin: 0; }
  .section-title { font-size: 14px; font-weight: 700; text-transform: uppercase; color: #6b7280; letter-spacing: 0.05em; margin: 20px 0 8px 0; padding-bottom: 4px; border-bottom: 1px solid #e5e7eb; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 6px 4px; font-weight: 600; color: #6b7280; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid #e5e7eb; }
  th:last-child, td:last-child { text-align: right; }
  td { padding: 5px 4px; border-bottom: 1px solid #f3f4f6; }
  .font-mono { font-family: 'Courier New', monospace; }
  .total-row td { font-weight: 700; border-top: 2px solid #1f2937; border-bottom: none; padding-top: 10px; font-size: 15px; }
  .grand-total td { font-size: 18px; border-top: 3px double #1f2937; padding-top: 10px; }
  .footer { text-align: center; margin-top: 32px; padding-top: 16px; border-top: 1px solid #e5e7eb; font-size: 12px; color: #9ca3af; }
  @media print { body { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
</style></head><body>
<div class="receipt">
  <div class="header">
    <h1>Calculadora Xerox do Victor</h1>
    <p>Recibo de Orçamento</p>
  </div>`

      receiptData.categories.forEach(cat => {
        if (cat.items.length === 0) return
        html += `<div class="section-title">${cat.name}</div>
<table><thead><tr><th>Item</th><th>Qtd</th><th>Preço</th><th>Subtotal</th></tr></thead><tbody>`
        cat.items.forEach(item => {
          html += `<tr><td>${item.name}</td><td>${item.qty}</td><td class="font-mono">${item.unitPrice}</td><td class="font-mono">${item.subtotal}</td></tr>`
        })
        html += `</tbody></table>`
      })

      if (receiptData.customServices.length > 0) {
        html += `<div class="section-title">Outros Serviços</div>
<table><thead><tr><th>Serviço</th><th colspan="2"></th><th>Valor</th></tr></thead><tbody>`
        receiptData.customServices.forEach(svc => {
          html += `<tr><td>${svc.name}</td><td colspan="2"></td><td class="font-mono">${svc.price}</td></tr>`
        })
        html += `</tbody></table>`
      }

      html += `
<table><tfoot>
  <tr class="total-row grand-total"><td colspan="3">TOTAL GERAL</td><td class="font-mono">${this.formatCurrency(receiptData.total)}</td></tr>
</tfoot></table>
<div class="footer">
  <p>Gerado em ${new Date().toLocaleDateString("pt-BR", { day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" })}</p>
  <p>Calculadora Xerox do Victor &mdash; Obrigado pela preferência!</p>
</div>
</div>
<script>window.onload = function() { window.print(); }<\/script>
</body></html>`

      printWindow.document.write(html)
      printWindow.document.close()
    }

    collectReceiptData() {
      const categories = []
      document.querySelectorAll("[data-calculator-category]").forEach(catEl => {
        const tabButton = document.querySelector(`[data-category-id="${catEl.dataset.calculatorCategory}"]`)
        const catName = tabButton?.textContent?.trim() || "Categoria"
        const items = []

        catEl.querySelectorAll("[data-calculator-row]").forEach(row => {
          const qty = parseFloat(row.querySelector("[data-calculator-target='qty']")?.value) || 0
          if (qty <= 0) return
          const name = row.querySelector(".font-medium")?.textContent?.trim() || "Item"
          const subtotal = row.querySelector("[data-calculator-target='subtotal']")?.textContent || "R$ 0,00"
          const rateDisplay = row.querySelector("[data-calculator-target='rateDisplay']")?.textContent || ""
          items.push({ name, qty, unitPrice: rateDisplay, subtotal })
        })

        if (items.length > 0) categories.push({ name: catName, items })
      })

      const customServices = []
      document.querySelectorAll("#custom-services-list > div").forEach(row => {
        const nameEl = row.querySelector(".font-medium")
        const priceEl = row.querySelector(".custom-service-price")
        if (nameEl && priceEl) customServices.push({ name: nameEl.textContent.trim(), price: priceEl.textContent.trim() })
      })

      return { categories, customServices, total: this.parseCurrency(this.grandTotalTargets[0]?.textContent || "R$ 0,00") }
    }

    // ── Tab switching ──

    switchCategory(event) {
      event.preventDefault()
      const tab = event.currentTarget
      const categoryId = tab.dataset.categoryId

      document.querySelectorAll("[data-calculator-target='tab']").forEach(t => {
        t.classList.remove("tab-active", "bg-gray-900", "text-white", "hover:bg-gray-800")
        t.classList.add("hover:bg-gray-100")
      })
      tab.classList.add("tab-active", "bg-gray-900", "text-white", "hover:bg-gray-800")
      tab.classList.remove("hover:bg-gray-100")

      document.querySelectorAll("[data-calculator-target='categoryContent']").forEach(el => {
        el.classList.add("hidden")
      })
      const target = document.getElementById(`category_${categoryId}`)
      if (target) target.classList.remove("hidden")
    }
  })
})()
</script>

</body>
</html>
